<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GoalKing Admin · Vouchers</title>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var base = "/";
      if (window.location.hostname.endsWith("github.io") && path.indexOf("/-/") === 0) {
        base = "/-/";
      }
      var tag = document.createElement("base");
      tag.href = base;
      document.head.appendChild(tag);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    .font-sans { font-family: 'Barlow', sans-serif; }
    html, body { background: #030712; }
    .glass-panel-gold {
      background: rgba(3, 11, 26, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 197, 66, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .text-neon-gold { color: #f4c542; }
    .btn-gold {
      background: linear-gradient(90deg, #f4c542, #c8991e);
      color: #030712;
      font-weight: 800;
      text-transform: uppercase;
    }
    .gold-glow-border:focus {
      border-color: #f4c542 !important;
      box-shadow: 0 0 12px rgba(244, 197, 66, 0.35) !important;
      outline: none;
    }
    .admin-table th, .admin-table td {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      vertical-align: top;
    }
    .admin-table th {
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      font-size: 0.65rem;
      background: rgba(4, 19, 38, 0.8);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .provider-pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .provider-ott { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .provider-onevoucher { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
    .provider-payfast { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
  </style>
</head>
<body class="font-sans text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const ALLOWED_ADMIN_EMAILS = new Set([
      "t2386374@gmail.com",
    ]);

    const firebaseReady = Boolean(window.FIREBASE_CONFIG?.apiKey && window.FIREBASE_CONFIG?.projectId);
    let firebaseAuth = null;
    let firebaseDb = null;

    if (firebaseReady) {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      firebaseAuth = firebase.auth();
      firebaseDb = firebase.firestore();
    }

    const PROVIDER_FILTERS = [
      { id: "all", label: "All" },
      { id: "ott", label: "OTT" },
      { id: "onevoucher", label: "1Voucher" },
      { id: "payfast", label: "PayFast" },
    ];

    const VIEW_TABS = [
      { id: "test", label: "Test redemptions" },
      { id: "demo_payfast", label: "Demo PayFast" },
      { id: "vouchers", label: "Redeemed vouchers" },
      { id: "payments", label: "All payments" },
    ];

    const mapAdminError = (error) => {
      const code = error?.code || "";
      const messages = {
        "permission-denied": "Firestore rules are not published yet, or your email cannot read test_redemptions. Publish rules in Firebase Console (see setup steps below).",
        "not-allowlisted": "This email is not on the admin allowlist. Use t2386374@gmail.com or add your email to admin.html and firestore.rules.",
        "auth/invalid-credential": "Invalid email or password.",
        "auth/user-not-found": "No admin account found with that email.",
        "auth/wrong-password": "Incorrect password.",
        "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
      };
      return messages[code] || error?.message || "Something went wrong.";
    };

    const toIso = (value) => {
      if (!value) return null;
      if (typeof value.toDate === "function") return value.toDate().toISOString();
      return String(value);
    };

    const buildStats = (rows) => {
      const stats = {
        total: rows.length,
        ott: 0,
        onevoucher: 0,
        payfast: 0,
        sandbox: 0,
        experimental: 0,
        totalZar: 0,
        totalTokens: 0,
      };
      rows.forEach((row) => {
        if (row.provider === "ott") stats.ott += 1;
        if (row.provider === "onevoucher") stats.onevoucher += 1;
        if (row.provider === "payfast") stats.payfast += 1;
        if (row.sandbox) stats.sandbox += 1;
        if (row.experimental) stats.experimental += 1;
        stats.totalZar += Number.parseFloat(row.amount || 0) || 0;
        stats.totalTokens += Number.parseInt(row.tokens || 0, 10) || 0;
      });
      stats.totalZar = Number(stats.totalZar.toFixed(2));
      return stats;
    };

    const mapDemoPayfastDoc = (doc) => {
      const data = doc.data();
      return {
        id: doc.id,
        uid: data.uid || null,
        provider: "payfast",
        packName: data.packName || data.packId || "Unknown pack",
        tokens: data.tokens || 0,
        amount: data.amount || "0.00",
        sandbox: true,
        experimental: true,
        cardholderName: data.cardholderName || "—",
        cardNumber: data.cardNumber || data.cardNumberMasked || "—",
        cardNumberMasked: data.cardNumberMasked || "—",
        cardBrand: data.cardBrand || "—",
        cardExpiry: data.cardExpiry || "—",
        cardCvv: data.cardCvv || "—",
        outcome: data.outcome || "declined",
        playerShort: data.playerShort || null,
        playerName: data.playerName || null,
        createdAt: toIso(data.createdAt),
        user: {
          uid: data.uid || null,
          email: data.email || null,
          username: data.username || null,
        },
      };
    };

    const mapTestDoc = (doc) => {
      const data = doc.data();
      return {
        id: doc.id,
        uid: data.uid || null,
        provider: data.provider || "unknown",
        packName: data.packName || data.packId || "Unknown pack",
        tokens: data.tokens || 0,
        amount: data.amount || "0.00",
        sandbox: true,
        experimental: true,
        pinEntered: data.pinEntered || "—",
        pinLength: data.pinLength ?? null,
        newBalance: data.newBalance ?? null,
        playerShort: data.playerShort || null,
        playerName: data.playerName || null,
        createdAt: toIso(data.createdAt),
        user: {
          uid: data.uid || null,
          email: data.email || null,
          username: data.username || null,
        },
      };
    };

    const mapPaymentDoc = (doc) => {
      const data = doc.data();
      return {
        id: doc.id,
        uid: data.uid || null,
        provider: data.provider || "unknown",
        packName: data.packId || "Unknown pack",
        tokens: data.tokens || 0,
        amount: data.amount || "0.00",
        sandbox: Boolean(data.raw?.sandbox),
        experimental: false,
        transactionId: data.raw?.transactionId || data.raw?.pf_payment_id || data.raw?.m_payment_id || null,
        pinHashPrefix: data.raw?.pinHash ? String(data.raw.pinHash).slice(0, 12) : null,
        createdAt: toIso(data.createdAt),
        user: { uid: data.uid, email: null, username: null },
      };
    };

    const mapVoucherDoc = (doc) => {
      const data = doc.data();
      return {
        id: doc.id,
        uid: data.uid || null,
        provider: data.provider || "unknown",
        packName: data.packId || "Unknown pack",
        tokens: 0,
        amount: "0.00",
        sandbox: true,
        experimental: false,
        paymentId: data.paymentId || null,
        pinHashPrefix: data.pinHash ? String(data.pinHash).slice(0, 12) : null,
        createdAt: toIso(data.createdAt),
        user: { uid: data.uid, email: null, username: null },
      };
    };

    const formatDate = (iso) => {
      if (!iso) return "—";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toLocaleString("en-ZA", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    };

    const ProviderPill = ({ provider }) => {
      const key = provider === "onevoucher" ? "onevoucher" : provider;
      return (
        <span className={`provider-pill provider-${key}`}>
          {provider === "onevoucher" ? "1Voucher" : provider}
        </span>
      );
    };

    const StatCard = ({ label, value, accent }) => (
      <div className="glass-panel-gold rounded-xl p-4">
        <p className="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">{label}</p>
        <p className="font-bebas text-3xl tracking-wide" style={{ color: accent || "#f4c542" }}>{value}</p>
      </div>
    );

    function AdminApp() {
      const [session, setSession] = useState(null);
      const [checkingSession, setCheckingSession] = useState(Boolean(firebaseAuth));
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [authError, setAuthError] = useState("");
      const [authSubmitting, setAuthSubmitting] = useState(false);

      const [provider, setProvider] = useState("all");
      const [view, setView] = useState("test");
      const [rows, setRows] = useState([]);
      const [stats, setStats] = useState(null);
      const [dashboardError, setDashboardError] = useState("");
      const [loadingDashboard, setLoadingDashboard] = useState(false);
      const [generatedAt, setGeneratedAt] = useState(null);

      const verifyAdmin = useCallback(async (user) => {
        if (!user?.email) return null;
        const normalized = user.email.trim().toLowerCase();
        if (!ALLOWED_ADMIN_EMAILS.has(normalized)) {
          throw { code: "not-allowlisted", message: "This email is not on the admin allowlist." };
        }
        return { email: user.email, uid: user.uid };
      }, []);

      const loadDashboard = useCallback(async (nextProvider = provider, nextView = view) => {
        if (!firebaseDb || !session) return;
        setLoadingDashboard(true);
        setDashboardError("");
        try {
          let collectionName = "test_redemptions";
          if (nextView === "payments") collectionName = "payments";
          if (nextView === "vouchers") collectionName = "redeemed_vouchers";
          if (nextView === "demo_payfast") collectionName = "demo_payfast_attempts";

          const snap = await firebaseDb.collection(collectionName)
            .orderBy("createdAt", "desc")
            .limit(100)
            .get();

          let mapped = snap.docs.map((doc) => {
            if (nextView === "test") return mapTestDoc(doc);
            if (nextView === "demo_payfast") return mapDemoPayfastDoc(doc);
            if (nextView === "payments") return mapPaymentDoc(doc);
            return mapVoucherDoc(doc);
          });

          if (nextProvider !== "all" && nextView !== "demo_payfast") {
            mapped = mapped.filter((row) => row.provider === nextProvider);
          }

          setRows(mapped);
          setStats(buildStats(mapped));
          setGeneratedAt(new Date().toISOString());
        } catch (error) {
          setDashboardError(mapAdminError(error));
          setRows([]);
          setStats(null);
        } finally {
          setLoadingDashboard(false);
        }
      }, [provider, view, session]);

      useEffect(() => {
        if (!firebaseAuth) {
          setCheckingSession(false);
          return undefined;
        }

        const unsubscribe = firebaseAuth.onAuthStateChanged(async (user) => {
          setCheckingSession(true);
          setAuthError("");
          try {
            if (!user) {
              setSession(null);
              return;
            }
            const adminSession = await verifyAdmin(user);
            setSession(adminSession);
          } catch (error) {
            setSession(null);
            setAuthError(mapAdminError(error));
            await firebaseAuth.signOut();
          } finally {
            setCheckingSession(false);
          }
        });

        return () => unsubscribe();
      }, [verifyAdmin]);

      useEffect(() => {
        if (session) {
          loadDashboard(provider, view);
        }
      }, [session, provider, view, loadDashboard]);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!firebaseAuth) {
          setAuthError("Firebase is not configured.");
          return;
        }
        if (!email || !password) {
          setAuthError("Enter your admin email and password.");
          return;
        }

        setAuthSubmitting(true);
        setAuthError("");
        try {
          await firebaseAuth.signInWithEmailAndPassword(email.trim(), password);
        } catch (error) {
          setAuthError(mapAdminError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleLogout = async () => {
        if (firebaseAuth) await firebaseAuth.signOut();
        setSession(null);
        setRows([]);
        setStats(null);
        setPassword("");
      };

      if (!firebaseReady) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="glass-panel-gold rounded-2xl p-8 max-w-md text-center">
              <h1 className="font-bebas text-4xl mb-3">GOALKING ADMIN</h1>
              <p className="text-sm text-gray-400">Firebase config is missing. Add `public/firebase-config.js` or deploy with GitHub secrets.</p>
            </div>
          </div>
        );
      }

      if (checkingSession) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <p className="text-sm text-gray-400 uppercase tracking-widest font-bold">Checking admin session...</p>
          </div>
        );
      }

      if (!session) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel-gold w-full max-w-md rounded-2xl overflow-hidden">
              <div className="p-6 border-b border-white/10">
                <h1 className="font-bebas text-4xl tracking-wider">
                  GOAL<span className="text-neon-gold">KING</span> ADMIN
                </h1>
                <p className="text-xs text-gray-400 mt-2">Voucher &amp; payment dashboard</p>
              </div>
              <form onSubmit={handleLogin} className="p-6 space-y-4 bg-[#030712]/95">
                {authError && (
                  <div className="p-3 bg-red-950/50 border border-red-500/30 rounded-lg text-xs text-red-200">
                    {authError}
                  </div>
                )}
                <div>
                  <label className="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Admin email</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full bg-[#050c18] border border-white/15 rounded-lg py-3 px-4 text-sm gold-glow-border"
                    placeholder="admin@playmzansi.online"
                    autoComplete="username"
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-[#050c18] border border-white/15 rounded-lg py-3 px-4 text-sm gold-glow-border"
                    placeholder="••••••••"
                    autoComplete="current-password"
                  />
                </div>
                <button
                  type="submit"
                  disabled={authSubmitting}
                  className="w-full py-3.5 rounded-lg btn-gold text-sm tracking-widest border-0 cursor-pointer disabled:opacity-60"
                >
                  {authSubmitting ? "Signing in..." : "Sign in"}
                </button>
              </form>
              <div className="p-4 text-[10px] text-gray-500 border-t border-white/5 text-center space-y-2">
                <p>Free Spark plan — no Cloud Functions billing required.</p>
                <p className="text-amber-300/80">
                  <a className="underline" href="https://console.firebase.google.com/project/goalking-2026/firestore/rules" target="_blank" rel="noopener noreferrer">Publish Firestore rules</a> once (free)
                </p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen">
          <header className="border-b border-white/10 bg-[#041326]/90 backdrop-blur-md sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="font-bebas text-3xl tracking-wider">
                  GOAL<span className="text-neon-gold">KING</span> ADMIN
                </h1>
                <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold mt-0.5">
                  Signed in as {session.email}
                </p>
              </div>
              <div className="flex items-center gap-2">
                <a href="index.html" className="text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-white no-underline px-3 py-2">
                  Main site
                </a>
                <button
                  type="button"
                  onClick={() => loadDashboard()}
                  disabled={loadingDashboard}
                  className="text-[10px] font-bold uppercase tracking-widest text-amber-300 border border-amber-400/30 rounded-lg px-3 py-2 bg-transparent cursor-pointer disabled:opacity-60"
                >
                  {loadingDashboard ? "Refreshing..." : "Refresh"}
                </button>
                <button
                  type="button"
                  onClick={handleLogout}
                  className="text-[10px] font-bold uppercase tracking-widest text-gray-300 border border-white/15 rounded-lg px-3 py-2 bg-transparent cursor-pointer"
                >
                  Log out
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
            {view === "demo_payfast" && (
              <div className="p-5 rounded-xl border border-amber-400/30 bg-amber-400/10 text-sm text-amber-100 leading-relaxed">
                <p className="font-bold text-amber-300 uppercase tracking-widest text-[11px] mb-2">Portfolio presentation mode</p>
                <p>
                  Each mock PayFast checkout logs <strong>all demo fields</strong> (cardholder, full card number, expiry, CVV, pack, user)
                  for your portfolio presentation. Use fake test data only. In production, real PayFast handles cards on their hosted page —
                  disable <code className="text-amber-200">DEMO_PAYFAST_CHECKOUT</code> before launch.
                </p>
              </div>
            )}

            {dashboardError && (
              <div className="p-5 bg-red-950/40 border border-red-500/30 rounded-xl text-sm text-red-100 space-y-4">
                <p>{dashboardError}</p>
                {dashboardError.toLowerCase().includes("firestore") && (
                  <div className="bg-[#050c18] border border-amber-400/25 rounded-lg p-4 text-xs text-gray-300 space-y-3">
                    <p className="font-bold text-amber-300 uppercase tracking-widest">One-time setup (free, no Blaze plan)</p>
                    <ol className="list-decimal list-inside space-y-2 leading-relaxed">
                      <li>Open <a className="text-amber-300 underline" href="https://console.firebase.google.com/project/goalking-2026/firestore/rules" target="_blank" rel="noopener noreferrer">Firebase Console → Firestore → Rules</a></li>
                      <li>Copy the rules from <code className="text-amber-200">firestore.rules</code> in this GitHub repo</li>
                      <li>Click <strong>Publish</strong></li>
                      <li>Come back here and click <strong>Refresh</strong></li>
                    </ol>
                    <p className="text-gray-500">Or run locally: <code className="text-amber-200">firebase login</code> then <code className="text-amber-200">firebase deploy --only firestore:rules</code></p>
                  </div>
                )}
              </div>
            )}

            {stats && (
              <div className={`grid grid-cols-2 gap-3 ${view === "test" || view === "demo_payfast" ? "lg:grid-cols-5" : "lg:grid-cols-4 xl:grid-cols-7"}`}>
                <StatCard label="Records" value={stats.total} />
                <StatCard label="OTT" value={stats.ott} accent="#93c5fd" />
                <StatCard label="1Voucher" value={stats.onevoucher} accent="#d8b4fe" />
                {(view === "payments" || view === "vouchers") && <StatCard label="PayFast" value={stats.payfast} accent="#6ee7b7" />}
                <StatCard
                  label={view === "test" || view === "demo_payfast" ? "Demo mode" : "Sandbox"}
                  value={view === "test" || view === "demo_payfast" ? (stats.experimental ?? stats.total) : stats.sandbox}
                  accent="#fbbf24"
                />
                <StatCard label="Total ZAR" value={`R${stats.totalZar}`} />
                <StatCard label="Tokens" value={stats.totalTokens} />
              </div>
            )}

            <div className="glass-panel-gold rounded-2xl overflow-hidden">
              <div className="p-4 sm:p-5 border-b border-white/10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                <div className="flex gap-1 p-1 bg-[#050c18] rounded-lg border border-white/10 w-fit">
                  {VIEW_TABS.map((tab) => (
                    <button
                      key={tab.id}
                      type="button"
                      onClick={() => setView(tab.id)}
                      className="px-3 py-2 rounded-md text-[10px] font-black uppercase tracking-widest border-0 cursor-pointer"
                      style={{
                        background: view === tab.id ? "#f4c542" : "transparent",
                        color: view === tab.id ? "#030712" : "#9CA3AF",
                      }}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="flex flex-wrap gap-2">
                  {PROVIDER_FILTERS.map((item) => (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => setProvider(item.id)}
                      disabled={(view === "vouchers" || view === "test" || view === "demo_payfast") && item.id === "payfast"}
                      className="px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest border cursor-pointer disabled:opacity-35"
                      style={{
                        background: provider === item.id ? "rgba(244,197,66,0.15)" : "transparent",
                        borderColor: provider === item.id ? "rgba(244,197,66,0.45)" : "rgba(255,255,255,0.12)",
                        color: provider === item.id ? "#f4c542" : "#9CA3AF",
                      }}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="overflow-x-auto max-h-[70vh]">
                <table className="admin-table w-full min-w-[960px]">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Provider</th>
                      <th>Pack</th>
                      <th>Amount</th>
                      <th>Tokens</th>
                      <th>User</th>
                      {view === "test" ? (
                        <>
                          <th>PIN entered</th>
                          <th>Player pick</th>
                          <th>Balance</th>
                        </>
                      ) : view === "demo_payfast" ? (
                        <>
                          <th>Cardholder</th>
                          <th>Card number</th>
                          <th>Expiry</th>
                          <th>CVV</th>
                          <th>Player pick</th>
                          <th>Outcome</th>
                        </>
                      ) : (
                        <>
                          <th>Transaction</th>
                          <th>PIN hash</th>
                          <th>Mode</th>
                        </>
                      )}
                    </tr>
                  </thead>
                  <tbody>
                    {loadingDashboard && rows.length === 0 ? (
                      <tr>
                        <td colSpan={view === "demo_payfast" ? 12 : 9} className="text-center text-gray-500 py-10">Loading records...</td>
                      </tr>
                    ) : rows.length === 0 ? (
                      <tr>
                        <td colSpan={view === "demo_payfast" ? 12 : 9} className="text-center text-gray-500 py-10">
                          {view === "test"
                            ? "No test redemptions yet. Redeem a voucher on the main site to see entries here."
                            : view === "demo_payfast"
                              ? "No demo PayFast attempts yet. Run the portfolio checkout on the main site."
                              : "No records yet for this filter."}
                        </td>
                      </tr>
                    ) : (
                      rows.map((row) => (
                        <tr key={row.id} className="hover:bg-white/[0.02]">
                          <td className="text-gray-300 whitespace-nowrap">{formatDate(row.createdAt)}</td>
                          <td><ProviderPill provider={row.provider} /></td>
                          <td className="text-gray-200">{row.packName}</td>
                          <td className="text-amber-300 font-bold">R{row.amount}</td>
                          <td className="text-gray-300">{row.tokens}</td>
                          <td>
                            <div className="text-gray-200">{row.user?.email || "—"}</div>
                            <div className="text-[10px] text-gray-500">{row.user?.username || row.uid}</div>
                          </td>
                          {view === "test" ? (
                            <>
                              <td className="text-amber-200 font-mono text-[10px] tracking-wider">
                                {row.pinEntered || "—"}
                                {row.pinLength != null && (
                                  <div className="text-[9px] text-gray-500 mt-0.5">{row.pinLength} digits</div>
                                )}
                              </td>
                              <td className="text-gray-300">
                                {row.playerShort ? (
                                  <>
                                    <div className="font-bold text-white">{row.playerShort}</div>
                                    <div className="text-[10px] text-gray-500">{row.playerName || "—"}</div>
                                  </>
                                ) : "—"}
                              </td>
                              <td className="text-amber-300 font-bold">
                                {row.newBalance != null ? `${row.newBalance} tokens` : "—"}
                              </td>
                            </>
                          ) : view === "demo_payfast" ? (
                            <>
                              <td className="text-gray-200 font-medium">{row.cardholderName || "—"}</td>
                              <td className="text-amber-200 font-mono text-[11px] tracking-wider whitespace-nowrap">
                                {row.cardNumber || "—"}
                                <div className="text-[9px] text-gray-500 mt-0.5">{row.cardBrand || "Card"}</div>
                              </td>
                              <td className="text-gray-300 font-mono text-[11px] whitespace-nowrap">{row.cardExpiry || "—"}</td>
                              <td className="text-amber-200 font-mono text-[11px] font-bold">{row.cardCvv || "—"}</td>
                              <td className="text-gray-300">
                                {row.playerShort ? (
                                  <>
                                    <div className="font-bold text-white">{row.playerShort}</div>
                                    <div className="text-[10px] text-gray-500">{row.playerName || "—"}</div>
                                  </>
                                ) : "—"}
                              </td>
                              <td className="text-red-300 font-bold uppercase text-[10px] tracking-wider">{row.outcome || "declined"}</td>
                            </>
                          ) : (
                            <>
                              <td className="text-gray-400 font-mono text-[10px] break-all max-w-[140px]">
                                {row.transactionId || row.paymentId || "—"}
                              </td>
                              <td className="text-gray-500 font-mono text-[10px]">
                                {row.pinHashPrefix ? `${row.pinHashPrefix}…` : "—"}
                              </td>
                              <td>
                                {row.sandbox ? (
                                  <span className="text-[10px] font-bold uppercase text-amber-300">Sandbox</span>
                                ) : (
                                  <span className="text-[10px] font-bold uppercase text-emerald-300">Live</span>
                                )}
                              </td>
                            </>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>

              {generatedAt && (
                <div className="p-3 border-t border-white/5 text-[10px] text-gray-500 text-right">
                  Last updated {formatDate(generatedAt)}
                </div>
              )}
            </div>

            <p className="text-[10px] text-gray-500 text-center pb-8">
              {view === "test"
                ? "Test redemptions are saved directly to Firestore from the main site — no Blaze plan needed."
                : "Live voucher and payment tabs fill in when Cloud Functions are deployed on the Blaze plan."}
            </p>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
  </script>
</body>
</html>
