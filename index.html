<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup GoalKing Draft 2026</title>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var base = "/";
      if (window.location.hostname.endsWith("github.io") && path.indexOf("/-/") === 0) {
        base = "/-/";
      }
      var tag = document.createElement("base");
      tag.href = base;
      document.head.appendChild(tag);
      window.__ASSET_BASE__ = base;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="logo.svg" />
  
  <!-- CDNs for Live React & Tailwind Environment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="stripe-config.js"></script>

  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    .font-cond { font-family: 'Barlow Condensed', sans-serif; }
    .font-sans { font-family: 'Barlow', sans-serif; }

    html { scroll-behavior: smooth; background-color: #030712; }
    
    /* Premium Glassmorphic Broadcast Panel Styling */
    .glass-panel-gold {
      background: rgba(3, 11, 26, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(244, 197, 66, 0.2);
      box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.8);
    }

    .text-neon-gold {
      color: #f4c542;
      text-shadow: 0 0 12px rgba(244, 197, 66, 0.45);
    }

    .gold-glow-border:focus {
      border-color: #f4c542 !important;
      box-shadow: 0 0 15px rgba(244, 197, 66, 0.4) !important;
      outline: none;
    }

    .btn-gold {
      background: linear-gradient(90deg, #f4c542, #c8991e);
      color: #030712;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(244, 197, 66, 0.5);
      filter: brightness(1.15);
    }

    /* 3D Coin Rotation */
    @keyframes rotateCoin {
      0% { transform: translateY(0) rotateY(0deg) scale(1); }
      50% { transform: translateY(-12px) rotateY(180deg) scale(1.05); }
      100% { transform: translateY(0) rotateY(360deg) scale(1); }
    }

    .animated-coin-bg {
      animation: rotateCoin 6s ease-in-out infinite;
    }

    /* FUT Cards Hover Breakout */
    .fut-card-wrapper {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }
    .fut-card-wrapper:hover {
      transform: translateY(-14px) scale(1.03);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    .sponsor-card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 5rem;
      padding: 1rem 1.25rem;
      background: rgba(9, 9, 11, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }

    .sponsor-card:hover {
      border-color: rgba(244, 197, 66, 0.25);
      background: rgba(24, 24, 27, 0.8);
      transform: translateY(-2px);
    }

    .sponsor-logo {
      height: 2rem;
      width: auto;
      max-width: 6.5rem;
      object-fit: contain;
      opacity: 0.55;
      transition: all 0.3s ease;
    }

    .sponsor-card:hover .sponsor-logo {
      opacity: 1;
      transform: scale(1.06);
    }

    .mzansi-side-blend {
      position: absolute;
      top: 0;
      bottom: 0;
      width: min(34vw, 460px);
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .mzansi-side-blend img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
    }

    .mzansi-side-blend--left img {
      object-position: 70% center;
      mask-image: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
    }

    .mzansi-side-blend--right img {
      object-position: 30% center;
      mask-image: linear-gradient(to left, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
    }

    .mzansi-flag-stripe {
      height: 4px;
      background: linear-gradient(90deg, #007A4D 0%, #007A4D 20%, #FFB612 20%, #FFB612 40%, #000000 40%, #000000 55%, #007A4D 55%, #007A4D 75%, #DE3831 75%, #DE3831 90%, #002395 90%, #002395 100%);
    }

    .mzansi-glow {
      background: radial-gradient(ellipse at 20% 50%, rgba(0, 122, 77, 0.18) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 50%, rgba(255, 182, 18, 0.12) 0%, transparent 55%);
    }

    .section-stadium-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .section-stadium-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
    }

    .section-stadium-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 5, 12, 0.92) 0%, rgba(2, 5, 12, 0.82) 45%, rgba(2, 5, 12, 0.94) 100%);
    }

    .nav-pill-bar {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.35rem;
      border-radius: 9999px;
      background: rgba(4, 19, 38, 0.75);
      border: 1px solid rgba(244, 197, 66, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-pill-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      min-width: 2.75rem;
      min-height: 2.75rem;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9ca3af;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-pill-link svg {
      width: 1.125rem;
      height: 1.125rem;
      flex-shrink: 0;
      display: block;
    }

    .nav-mobile-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 0;
      padding: 0 0.5rem;
    }

    .intro-play-btn {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      border: none;
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .intro-play-btn:hover {
      background: rgba(0, 0, 0, 0.5);
    }

    .intro-play-btn__circle {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(244, 197, 66, 0.55);
      background: rgba(0, 0, 0, 0.7);
      color: #f4c542;
      box-shadow: 0 0 24px rgba(244, 197, 66, 0.25);
      animation: playPulse 2s ease-in-out infinite;
    }

    .intro-play-btn__label {
      color: #f4c542;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @keyframes playPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 197, 66, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(244, 197, 66, 0); }
    }

    .nav-pill-link:hover {
      color: #f4c542;
      background: rgba(244, 197, 66, 0.08);
    }

    .nav-pill-link--active {
      color: #030712;
      background: linear-gradient(90deg, #f4c542, #e6b52e);
      box-shadow: 0 4px 14px rgba(244, 197, 66, 0.35);
    }

    .nav-pill-link--active:hover {
      color: #030712;
      background: linear-gradient(90deg, #f4c542, #e6b52e);
    }

    .intro-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.6s ease;
      padding: 1rem;
    }

    .intro-splash__frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: min(94vw, 400px);
      max-height: min(82vh, 720px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(244, 197, 66, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (min-width: 640px) {
      .intro-splash__frame {
        max-width: min(78vw, 640px);
        max-height: min(86vh, 860px);
      }
    }

    @media (min-width: 1024px) {
      .intro-splash {
        padding: 2rem;
      }
      .intro-splash__frame {
        max-width: min(68vw, 960px);
        max-height: min(88vh, 940px);
        border-radius: 18px;
      }
    }

    @media (min-width: 1536px) {
      .intro-splash__frame {
        max-width: min(58vw, 1200px);
        max-height: min(90vh, 1000px);
      }
    }

    .intro-splash__frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .intro-splash--out {
      opacity: 0;
      pointer-events: none;
    }

    .intro-splash--flash {
      animation: introFlash 0.75s ease forwards;
    }

    @keyframes introFlash {
      0% { opacity: 1; background: #000; }
      35% { opacity: 1; background: #fff; }
      100% { opacity: 0; background: #030712; }
    }

    .site-content--hidden {
      opacity: 0;
      pointer-events: none;
    }

    .site-content--visible {
      opacity: 1;
      transition: opacity 0.8s ease 0.15s;
    }

    .prize-winner-frame {
      position: relative;
      width: 100%;
      min-height: 18rem;
      max-height: 28rem;
      aspect-ratio: 992 / 1040;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(180deg, #041a0f 0%, #030a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prize-winner-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    .prize-winner-caption-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5.5rem;
      background: linear-gradient(to top, rgba(3, 10, 26, 0.95) 0%, rgba(3, 10, 26, 0.55) 55%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    /* ─── Holographic player reveal ─────────────────────────── */
    .fut-card-wrapper--selected {
      animation: cardHoloPulse 2.4s ease-in-out infinite;
    }

    @keyframes cardHoloPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    .holo-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: radial-gradient(ellipse at 50% 40%, rgba(0, 180, 255, 0.12) 0%, rgba(3, 7, 18, 0.94) 55%, rgba(0, 0, 0, 0.98) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: holoOverlayIn 0.45s ease forwards;
    }

    .holo-overlay--exit {
      animation: holoOverlayOut 0.35s ease forwards;
    }

    @keyframes holoOverlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes holoOverlayOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .holo-stage {
      position: relative;
      width: min(92vw, 520px);
      animation: holoStageRise 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .holo-overlay--exit .holo-stage {
      animation: holoStageDrop 0.35s ease forwards;
    }

    @keyframes holoStageRise {
      from { opacity: 0; transform: translateY(40px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes holoStageDrop {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(24px) scale(0.95); }
    }

    .holo-frame {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 2px solid rgba(0, 220, 255, 0.45);
      box-shadow:
        0 0 40px rgba(0, 200, 255, 0.25),
        0 0 80px rgba(120, 80, 255, 0.15),
        inset 0 0 60px rgba(0, 200, 255, 0.08);
      background: linear-gradient(180deg, rgba(4, 19, 38, 0.95) 0%, rgba(2, 8, 20, 0.98) 100%);
    }

    .holo-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(0, 255, 255, 0.08) 45%,
        rgba(255, 100, 255, 0.1) 50%,
        rgba(0, 255, 200, 0.08) 55%,
        transparent 70%
      );
      background-size: 200% 100%;
      animation: holoShimmer 2.8s linear infinite;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes holoShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .holo-scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 220, 255, 0.04) 2px,
        rgba(0, 220, 255, 0.04) 4px
      );
      animation: holoScanMove 6s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes holoScanMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(8px); }
    }

    .holo-arena {
      position: relative;
      height: 320px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(0, 200, 255, 0.18) 0%, transparent 55%),
        linear-gradient(180deg, #061428 0%, #02060f 100%);
    }

    .holo-grid {
      position: absolute;
      bottom: -20%;
      left: -10%;
      right: -10%;
      height: 55%;
      background:
        linear-gradient(rgba(0, 220, 255, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 220, 255, 0.35) 1px, transparent 1px);
      background-size: 28px 28px;
      transform: perspective(280px) rotateX(62deg);
      transform-origin: center bottom;
      opacity: 0.45;
      animation: holoGridPulse 3s ease-in-out infinite;
    }

    @keyframes holoGridPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.55; }
    }

    .holo-club-beacon {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 220, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 200, 255, 0.3);
      z-index: 2;
      animation: holoBeaconPulse 2s ease-in-out infinite;
    }

    @keyframes holoBeaconPulse {
      0%, 100% { box-shadow: 0 0 16px rgba(0, 200, 255, 0.25); }
      50% { box-shadow: 0 0 32px rgba(0, 200, 255, 0.5); }
    }

    .holo-club-beacon img {
      width: 2rem;
      height: 2rem;
      object-fit: contain;
    }

    .holo-figure-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 3;
      padding-bottom: 12%;
    }

    .holo-motion-wrap {
      position: relative;
      height: 88%;
      max-width: 75%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: holoMaterialize 0.8s ease forwards, holoFlicker 4s ease-in-out 0.8s infinite;
    }

    .holo-motion-wrap--sprint {
      animation: holoMaterialize 0.8s ease forwards, holoSprint 1.1s ease-in-out 0.9s infinite, holoFlicker 4s ease-in-out 0.8s infinite;
    }

    .holo-motion-wrap--dribble {
      animation: holoMaterialize 0.8s ease forwards, holoDribble 1.4s ease-in-out 0.9s infinite, holoFlicker 4s ease-in-out 0.8s infinite;
    }

    .holo-figure {
      position: relative;
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 0 18px rgba(0, 220, 255, 0.55)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.8));
      z-index: 2;
    }

    .holo-figure-ghost {
      position: absolute;
      bottom: 0;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      z-index: 1;
    }

    .holo-figure-ghost--cyan {
      left: -3px;
      filter: drop-shadow(0 0 8px cyan);
      mix-blend-mode: screen;
      opacity: 0.25;
      animation: holoGhostCyan 1.1s ease-in-out 0.9s infinite;
    }

    .holo-figure-ghost--magenta {
      right: -3px;
      filter: drop-shadow(0 0 8px magenta);
      mix-blend-mode: screen;
      opacity: 0.22;
      animation: holoGhostMagenta 1.1s ease-in-out 0.9s infinite;
    }

    @keyframes holoMaterialize {
      0% { opacity: 0; transform: scale(0.6) translateY(30px); filter: blur(8px) brightness(2); }
      40% { opacity: 0.7; filter: blur(2px) brightness(1.6); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0) brightness(1); }
    }

    @keyframes holoFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.82; }
      94% { opacity: 1; }
      96% { opacity: 0.88; }
      97% { opacity: 1; }
    }

    @keyframes holoSprint {
      0%, 100% { transform: translateX(-6px) translateY(0) scaleX(1); }
      25% { transform: translateX(4px) translateY(-4px) scaleX(1.02); }
      50% { transform: translateX(8px) translateY(0) scaleX(1); }
      75% { transform: translateX(-2px) translateY(-3px) scaleX(0.98); }
    }

    @keyframes holoDribble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-10px) rotate(-2deg); }
      50% { transform: translateX(6px) rotate(1.5deg); }
      75% { transform: translateX(-4px) rotate(-1deg); }
    }

    @keyframes holoGhostCyan {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }

    @keyframes holoGhostMagenta {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.3; }
    }

    .holo-gesture {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 220, 255, 0.35);
      animation: holoGesturePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
    }

    @keyframes holoGesturePop {
      from { opacity: 0; transform: scale(0.3) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .holo-gesture-icon {
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      animation: holoGestureBounce 1.8s ease-in-out 1s infinite;
    }

    @keyframes holoGestureBounce {
      0%, 100% { transform: rotate(0deg) scale(1); }
      30% { transform: rotate(-8deg) scale(1.08); }
      60% { transform: rotate(6deg) scale(1.05); }
    }

    .holo-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      border-radius: 0.5rem;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(244, 197, 66, 0.35);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f4c542;
      animation: holoBadgeIn 0.5s ease 0.3s both;
    }

    @keyframes holoBadgeIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

      const playClip = (src, { volume = 1, loop = false, delay = 0 } = {}) => {
        if ((isMutedRef && isMutedRef.current) || !src) return null;
        const audio = new Audio(src);
        audio.volume = volume;
        audio.loop = loop;
        audio.preload = "auto";
        active.push(audio);
        const timer = setTimeout(() => {
          audio.play().catch(() => {});
        }, delay);
        timers.push(timer);
        return audio;
      };

      const fadeOutAll = (duration = 450) => {
        timers.forEach(clearTimeout);
        active.forEach((audio) => {
          const start = audio.volume;
          const steps = 8;
          let step = 0;
          const interval = setInterval(() => {
            step += 1;
            audio.volume = Math.max(0, start * (1 - step / steps));
            if (step >= steps) {
              clearInterval(interval);
              audio.pause();
            }
          }, duration / steps);
        });
        setTimeout(() => {
          active.forEach((audio) => audio.pause());
          active.length = 0;
        }, duration + 40);
      };

        if ((isMutedRef && isMutedRef.current) || !window.speechSynthesis) return;

        const line = new SpeechSynthesisUtterance(`${player.name}!`);
        line.rate = 1.02;
        line.pitch = 0.92;
        const voices = window.speechSynthesis.getVoices();
        const voice = voices.find(v => /Thomas|Ryan|George/i.test(v.name)) || voices.find(v => v.lang.startsWith("en")) || voices[0];

        window.speechSynthesis.speak(line);

        const isStriker = player.cat === "striker";
        const roarVol = isSiuu ? 1 : isStriker ? 0.85 : 0.65;
        const cheerVol = isSiuu ? 0.95 : isStriker ? 0.78 : 0.58;

        playClip(STADIUM_SOUNDS.goalRoar, { volume: roarVol });
        timers.push(setTimeout(() => playClip(STADIUM_SOUNDS.crowdCheer, { volume: cheerVol }), isSiuu ? 350 : 220));

          timers.push(setTimeout(triggerGoalMoment, 1800));
        }
      };

        };
        await ref.set(profile);
        return profile;
      }

      return snap.data();
    }

    function HologramReveal({ player, exiting, onClose, onConfirm }) {
      const config = TIER_CONFIG[player.tier] || TIER_CONFIG.GOLD;
      const gestureKey = PLAYER_GESTURES[player.id] || (player.cat === "striker" ? "thumbs" : "wink");
      const gesture = GESTURE_CONFIG[gestureKey];
      const motionClass = player.cat === "striker" ? "holo-motion-wrap--sprint" : "holo-motion-wrap--dribble";
      const [soundOn, setSoundOn] = useState(() => sessionStorage.getItem("holoSoundOn") !== "0");
      const audioSessionRef = useRef(null);
      const soundMutedRef = useRef(!soundOn);
      soundMutedRef.current = !soundOn;
      const particles = useRef(
        Array.from({ length: 14 }, (_, i) => ({
          id: i,
          left: `${8 + (i * 6.2) % 84}%`,
          top: `${12 + (i * 11) % 70}%`,
          delay: `${(i * 0.35) % 2.5}s`,
          duration: `${2.2 + (i % 3) * 0.6}s`,
        }))
      );

      useEffect(() => {
        const prev = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = prev; };
      }, []);

      useEffect(() => {
        if (exiting) return undefined;
        if (audioSessionRef.current) audioSessionRef.current.fadeOutAll(120);
        const session = createHoloAudioSession(player, soundMutedRef);
        audioSessionRef.current = session;
        session.start();
        return () => session.fadeOutAll(300);
      }, [player.id, exiting]);

      useEffect(() => {
        if (exiting && audioSessionRef.current) {
          audioSessionRef.current.fadeOutAll(280);
        }
      }, [exiting]);

      const toggleSound = () => {
        setSoundOn((prev) => {
          const next = !prev;
          sessionStorage.setItem("holoSoundOn", next ? "1" : "0");
          if (!next) audioSessionRef.current?.fadeOutAll(220);
          return next;
        });
      };

      const handleConfirm = () => {
        audioSessionRef.current?.confirm();
        onConfirm();
      };

      return (
        <div
          className={`holo-overlay${exiting ? " holo-overlay--exit" : ""}`}
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={`${player.name} hologram reveal`}
        >
          <div className="holo-stage" onClick={e => e.stopPropagation()}>
            <div className="holo-frame">
              <button type="button" className="holo-close" onClick={onClose} aria-label="Close hologram">
                <SVGIcons.Close />
              </button>
              <button
                type="button"
                className="holo-close"
                style={{ right: "3.25rem" }}
                onClick={toggleSound}
                aria-label={soundOn ? "Mute stadium sounds" : "Unmute stadium sounds"}
                title={soundOn ? "Mute sounds" : "Unmute sounds"}
              >
                {soundOn ? <SVGIcons.SoundOn /> : <SVGIcons.SoundOff />}
              </button>

              <div className="holo-arena">
                <div className="holo-particles">
                  {particles.current.map(pt => (
                    <span
                      key={pt.id}
                      className="holo-particle"
                      style={{ left: pt.left, top: pt.top, animationDelay: pt.delay, animationDuration: pt.duration }}
                    />
                  ))}
                </div>
                <div className="holo-grid" />
                <div className="holo-club-beacon">
                  <img src={player.clubUrl} alt="" />
                </div>

                <div className="holo-badge">
                  <img src={player.flagUrl} className="w-4 rounded-sm" alt="" />
                  <span>HOLO PROJECTION</span>
                </div>

                <div className="holo-gesture" title={gesture.label}>
                  <span className="holo-gesture-icon" aria-hidden="true">{gesture.emoji}</span>
                  <span className="text-[10px] font-bold text-cyan-200 max-w-[9rem] leading-tight">{gesture.message}</span>
                </div>

                <div className="holo-figure-wrap">
                  <div className={`holo-motion-wrap ${motionClass}`}>
                    <img src={player.imageUrl} alt="" className="holo-figure-ghost holo-figure-ghost--cyan" aria-hidden="true" />
                    <img src={player.imageUrl} alt="" className="holo-figure-ghost holo-figure-ghost--magenta" aria-hidden="true" />
                    <img src={player.imageUrl} alt={player.name} className="holo-figure" />
                  </div>
                </div>

                <div className="holo-scanlines" />
              </div>

              <div className="holo-footer">
                <p className="text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-300/80 mb-1">Player Materialized</p>
                <h3 className="font-bebas text-3xl text-white tracking-wider uppercase" style={{ color: config.textAccent }}>
                  {player.short}
                </h3>
                <p className="text-xs text-gray-400 mt-1">{player.name} · {player.pos} · {player.nat} · {player.rating} OVR</p>
                <p className="text-[10px] text-gray-500 mt-2 uppercase tracking-wider">
                  {player.cat === "striker" ? "Sprint hologram active" : "Dribble hologram active"} · Stadium audio live
                </p>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className="btn-gold mt-5 w-full py-3.5 rounded-lg text-xs tracking-widest cursor-pointer border-none"
                >
                  Lock In {player.short}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [filter, setFilter] = useState("all");
      const [selectedPlayer, setSelectedPlayer] = useState(PLAYERS[0]);
      const [hologramPlayer, setHologramPlayer] = useState(null);
      const [hologramExiting, setHologramExiting] = useState(false);
      const [toast, setToast] = useState(null);
      const [scrolled, setScrolled] = useState(false);
      const [activeNav, setActiveNav] = useState("home");
      const [showIntro, setShowIntro] = useState(true);
      const [introExiting, setIntroExiting] = useState(false);
      const [introPlaying, setIntroPlaying] = useState(false);
      const [siteVisible, setSiteVisible] = useState(false);
      const [simulationFocus, setSimulationFocus] = useState(false);
      const [lastRoundGoals, setLastRoundGoals] = useState(0);
      const introVideoRef = useRef(null);

      // Auth Options
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authUsername, setAuthUsername] = useState("");
      const [authError, setAuthError] = useState("");
      const [authSuccess, setAuthSuccess] = useState("");
      const [authLoading, setAuthLoading] = useState(firebaseReady);
      const [authSubmitting, setAuthSubmitting] = useState(false);
      const [showResendVerification, setShowResendVerification] = useState(false);
      const [purchasingPackId, setPurchasingPackId] = useState(null);

      const emailVerificationSettings = {
        url: window.location.origin,
        handleCodeInApp: false,
      };

      // Live Simulator State
      const [currentStage, setCurrentStage] = useState(0); 
      const [playerScores, setPlayerScores] = useState(
        () => Object.fromEntries(PLAYERS.map(p => [p.short, 0]))
      );

      // Simple Countdown logic
      const [timeLeft, setTimeLeft] = useState({ d: "000", h: "00", m: "00", s: "00" });

      const dismissIntro = useCallback(() => {
        if (introExiting) return;
        setIntroExiting(true);
        setTimeout(() => {
          setShowIntro(false);
          setSiteVisible(true);
          document.body.style.overflow = "";
        }, 750);
      }, [introExiting]);

      useEffect(() => {
        setShowIntro(true);
        setSiteVisible(false);
        setIntroExiting(false);
        setIntroPlaying(false);

        const handlePageShow = (event) => {
          if (event.persisted) {
            setShowIntro(true);
            setSiteVisible(false);
            setIntroExiting(false);
            setIntroPlaying(false);
          }
        };
        window.addEventListener("pageshow", handlePageShow);
        return () => window.removeEventListener("pageshow", handlePageShow);
      }, []);

      useEffect(() => {
        document.body.style.overflow = showIntro ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [showIntro]);

      const handleNavClick = useCallback((item) => {
        setActiveNav(item.id);
        const el = document.getElementById(item.section);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        else window.scrollTo({ top: 0, behavior: "smooth" });
      }, []);

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);

          const scrollPos = window.scrollY + 120;
          for (let i = NAV_LINKS.length - 1; i >= 0; i--) {
            const section = document.getElementById(NAV_LINKS[i].section);
            if (section && section.offsetTop <= scrollPos) {
              setActiveNav(NAV_LINKS[i].id);
              break;
            }
          }
        };
        window.addEventListener("scroll", handleScroll);
        
        const targetDate = new Date("2026-06-11T18:00:00Z");
        const calcTime = () => {
          const diff = Math.max(0, targetDate - Date.now());
          setTimeLeft({
            d: String(Math.floor(diff / 86400000)).padStart(3, "0"),
            h: String(Math.floor((diff % 86400000) / 3600000)).padStart(2, "0"),
            m: String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0"),
            s: String(Math.floor((diff % 60000) / 1000)).padStart(2, "0"),
          });
        };
        calcTime();
        const tid = setInterval(calcTime, 1000);

        return () => {
          window.removeEventListener("scroll", handleScroll);
          clearInterval(tid);
        };
      }, []);

      const showToast = useCallback((msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      }, []);

      const closeHologram = useCallback((confirmPick = false) => {
        if (!hologramPlayer) return;
        const player = hologramPlayer;
        setHologramExiting(true);
        setTimeout(() => {
          setHologramPlayer(null);
          setHologramExiting(false);
          if (confirmPick) {
            showToast(`Prediction locked to: ${player.name.toUpperCase()}`, "success");
          }
        }, 320);
      }, [hologramPlayer, showToast]);

      const selectPlayer = useCallback((player) => {
        setSelectedPlayer(player);
        setHologramExiting(false);
        setHologramPlayer(player);
        if (simulationFocus) setLastRoundGoals(0);
      }, [simulationFocus]);

      useEffect(() => {
        if (!hologramPlayer) return undefined;
        const onKeyDown = (e) => {
          if (e.key === "Escape") closeHologram(false);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [hologramPlayer, closeHologram]);

      const playIntroVideo = useCallback(() => {
        const video = introVideoRef.current;
        if (!video) return;
        video.muted = false;
        video.volume = 1;
        video.play()
          .then(() => setIntroPlaying(true))
          .catch(() => {
            showToast("Could not play video. Tap play to try again.", "info");
          });
      }, [showToast]);

      const closeAuthModal = useCallback(() => {
        setIsAuthModalOpen(false);
        setAuthError("");
        setAuthSuccess("");
        setAuthEmail("");
        setAuthPassword("");
        setAuthUsername("");
        setShowResendVerification(false);
      }, []);

      const setUserFromFirebase = useCallback(async (firebaseUser) => {
        if (!firebaseUser) {
          setCurrentUser(null);
          return;
        }
        const profile = await loadUserProfile(firebaseUser.uid);
        setCurrentUser({
          uid: firebaseUser.uid,
          email: firebaseUser.email,
          username: profile?.username
            || firebaseUser.displayName
            || (firebaseUser.email ? firebaseUser.email.split("@")[0].toUpperCase() : "CONTESTANT"),
          photoURL: profile?.photoURL || firebaseUser.photoURL || null,
          tokens: profile?.tokens ?? 0,
          emailVerified: firebaseUser.emailVerified,
        });
      }, []);

      useEffect(() => {
        if (!firebaseAuth) {
          setAuthLoading(false);
          return;
        }

        const unsubscribe = firebaseAuth.onAuthStateChanged(async (firebaseUser) => {
          try {
            await setUserFromFirebase(firebaseUser);
          } finally {
            setAuthLoading(false);
          }
        });

        return () => unsubscribe();
      }, [setUserFromFirebase]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const paymentStatus = params.get("payment");
        const packId = params.get("pack");

        if (!paymentStatus) return;

        if (paymentStatus === "success") {
          const pack = TOKEN_PACKS.find((item) => item.id === packId);
          showToast(
            pack
              ? `${pack.name} pack payment received. Tokens will appear shortly.`
              : "Payment successful. Your tokens will appear shortly.",
            "success"
          );
          if (firebaseAuth?.currentUser) {
            firebaseAuth.currentUser.reload().then(() => setUserFromFirebase(firebaseAuth.currentUser));
          }
        } else if (paymentStatus === "cancelled") {
          showToast("Payment cancelled. No tokens were charged.", "info");
        }

        params.delete("payment");
        params.delete("pack");
        params.delete("session_id");
        const remaining = params.toString();
        const nextUrl = `${window.location.pathname}${remaining ? `?${remaining}` : ""}${window.location.hash}`;
        window.history.replaceState({}, "", nextUrl);
      }, [setUserFromFirebase, showToast]);

      const handlePurchasePack = async (pack) => {
        if (!currentUser) {
          showToast("Please log in to purchase coin packages.", "info");
          setIsAuthModalOpen(true);
          return;
        }

        if (!firebaseFunctions) {
          showToast("Payments are not configured yet. Deploy Firebase Functions first.", "info");
          return;
        }

        if (currentUser.emailVerified === false) {
          showToast("Verify your email before purchasing token packs.", "info");
          setAuthMode("login");
          setIsAuthModalOpen(true);
          return;
        }

        setPurchasingPackId(pack.id);
        try {
          const createCheckoutSession = firebaseFunctions.httpsCallable("createCheckoutSession");
          const result = await createCheckoutSession({
            packId: pack.id,
            origin: window.location.origin,
          });

          if (!result?.data?.url) {
            throw new Error("Stripe checkout URL was not returned.");
          }

          window.location.href = result.data.url;
        } catch (error) {
          const message = error?.message || "Could not start checkout. Try again.";
          showToast(message, "info");
        } finally {
          setPurchasingPackId(null);
        }
      };

      const handleEmailSignUp = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add your keys to public/firebase-config.js.");
          return;
        }

        if (!authEmail || !authPassword || !authUsername) {
          setAuthError("All fields are required to create a GoalKing profile.");
          return;
        }

        if (authPassword.length < 6) {
          setAuthError("Password must be at least 6 characters.");
          return;
        }

        setAuthSubmitting(true);
        setShowResendVerification(false);
        try {
          const credential = await firebaseAuth.createUserWithEmailAndPassword(authEmail, authPassword);
          await ensureUserProfile(credential.user, authUsername.trim().toUpperCase());
          await credential.user.sendEmailVerification(emailVerificationSettings);
          await firebaseAuth.signOut();
          setAuthMode("login");
          setAuthPassword("");
          setAuthUsername("");
          setAuthSuccess(`Confirmation email sent to ${authEmail}. Open the link in your inbox, then log in.`);
          showToast("Check your inbox to verify your email.", "info");
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleEmailLogIn = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add your keys to public/firebase-config.js.");
          return;
        }

        if (!authEmail || !authPassword) {
          setAuthError("Please input your registered email address and password.");
          return;
        }

        setAuthSubmitting(true);
        setShowResendVerification(false);
        try {
          const credential = await firebaseAuth.signInWithEmailAndPassword(authEmail, authPassword);
          await credential.user.reload();
          const isPasswordAccount = credential.user.providerData.some((p) => p.providerId === "password");

          if (isPasswordAccount && !credential.user.emailVerified) {
            await firebaseAuth.signOut();
            setAuthError(`Please verify your email first. We sent a confirmation link to ${authEmail}.`);
            setShowResendVerification(true);
            return;
          }

          const profile = await loadUserProfile(credential.user.uid);
          await setUserFromFirebase(credential.user);
          const displayName = profile?.username || authEmail.split("@")[0].toUpperCase();
          setAuthSuccess("Login successful! Welcome back.");
          showToast(`Logged in as ${displayName}`);
          setTimeout(closeAuthModal, 1200);
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleResendVerification = async () => {
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add your keys to public/firebase-config.js.");
          return;
        }

        if (!authEmail || !authPassword) {
          setAuthError("Enter your email and password above, then resend the verification email.");
          return;
        }

        setAuthSubmitting(true);
        try {
          const credential = await firebaseAuth.signInWithEmailAndPassword(authEmail, authPassword);
          await credential.user.reload();

          if (credential.user.emailVerified) {
            const profile = await loadUserProfile(credential.user.uid);
            await setUserFromFirebase(credential.user);
            setShowResendVerification(false);
            setAuthSuccess("Your email is already verified. You're logged in!");
            showToast(`Welcome back, ${profile?.username || authEmail.split("@")[0].toUpperCase()}!`);
            setTimeout(closeAuthModal, 1200);
            return;
          }

          await credential.user.sendEmailVerification(emailVerificationSettings);
          await firebaseAuth.signOut();
          setAuthSuccess(`Verification email resent to ${authEmail}. Check your inbox and spam folder.`);
          showToast("Verification email sent again.", "info");
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleGoogleSignIn = async () => {
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add your keys to public/firebase-config.js.");
          return;
        }

        setAuthSubmitting(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const credential = await firebaseAuth.signInWithPopup(provider);
          const profile = await ensureUserProfile(credential.user);
          await setUserFromFirebase(credential.user);
          setAuthSuccess("Signed in with Google.");
          showToast(`Welcome, ${profile?.username || credential.user.displayName}!`);
          setTimeout(closeAuthModal, 1200);
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleSignOut = async () => {
        try {
          if (firebaseAuth) {
            await firebaseAuth.signOut();
          } else {
            setCurrentUser(null);
          }
          showToast("Signed out of your GoalKing profile.", "info");
        } catch (error) {
          showToast(mapAuthError(error), "info");
        }
      };

      const startPlayerSimulation = useCallback(() => {
        if (!selectedPlayer) {
          showToast("Select a golden boot pick first.", "info");
          return;
        }
        setSimulationFocus(true);
        setTimeout(() => {
          document.getElementById("leaderboard-tracker")?.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 50);
        showToast(`Simulating tournament path for ${selectedPlayer.name}…`, "info");
      }, [selectedPlayer, showToast]);

      const advanceTournamentStage = () => {
        if (currentStage >= 4) {
          showToast("Tournament is finished! Gold boot champion declared.", "info");
          return;
        }

        const nextStageIndex = currentStage + 1;
        const roundNames = ["Group Stage", "Round of 16", "Quarter-Finals", "Semi-Finals", "Final"];
        let backedGoalsAdded = 0;
        
        setPlayerScores(prev => {
          const updated = { ...prev };
          Object.keys(updated).forEach(pName => {
            const playerObj = PLAYERS.find(p => p.short === pName);
            const isBacked = selectedPlayer && pName === selectedPlayer.short;
            const bias = playerObj ? (playerObj.rating - 80) / 4 : 2;
            let goalsAdded = Math.max(0, Math.floor(Math.random() * 3) + Math.floor(bias * 0.45));
            if (isBacked) {
              goalsAdded += Math.floor(Math.random() * 2) + 1;
              backedGoalsAdded = goalsAdded;
            }
            if (!simulationFocus) {
              updated[pName] += goalsAdded;
            } else if (isBacked) {
              updated[pName] += goalsAdded;
            }
          });
          return updated;
        });

        if (simulationFocus && selectedPlayer) {
          setLastRoundGoals(backedGoalsAdded);
        }

        setCurrentStage(nextStageIndex);
        if (simulationFocus && selectedPlayer) {
          showToast(`${selectedPlayer.short} scored +${backedGoalsAdded} goals in ${roundNames[nextStageIndex]}!`);
        } else {
          showToast(`Simulation completed for: ${roundNames[nextStageIndex]}`);
        }
      };

      const resetTournamentSimulation = () => {
        setPlayerScores(Object.fromEntries(PLAYERS.map(p => [p.short, 0])));
        setCurrentStage(0);
        setLastRoundGoals(0);
        showToast("Leaderboard standings reset to opening group matches.", "info");
      };

      const filteredPlayers = filter === "all" ? PLAYERS : PLAYERS.filter(p => p.cat === filter);

      const sortedScoreboard = Object.entries(playerScores)
        .map(([name, goals]) => {
          const pData = PLAYERS.find(p => p.short === name);
          return { name, goals, flag: pData?.flagUrl || "", rating: pData?.rating || 90 };
        })
        .sort((a, b) => b.goals - a.goals);

      return (
        <>
          {showIntro && (
            <div className={`intro-splash ${introExiting ? "intro-splash--out intro-splash--flash" : ""}`}>
              <div className="intro-splash__frame">
                <video
                  ref={introVideoRef}
                  key="goalking-intro"
                  src={assetPath("goalking.mp4")}
                  playsInline
                  preload="metadata"
                  poster={assetPath("logo.svg")}
                  onPlay={() => setIntroPlaying(true)}
                  onEnded={dismissIntro}
                  onError={dismissIntro}
                />
                <div className="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-black/30 pointer-events-none" />
                {!introPlaying && (
                  <button
                    type="button"
                    onClick={playIntroVideo}
                    className="intro-play-btn"
                    aria-label="Play intro video"
                  >
                    <span className="intro-play-btn__circle">
                      <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5v14l11-7z" />
                      </svg>
                    </span>
                    <span className="intro-play-btn__label">Play Intro</span>
                  </button>
                )}
              </div>
              <button
                onClick={dismissIntro}
                className="absolute bottom-6 right-6 sm:bottom-8 sm:right-8 z-10 px-5 py-2.5 rounded-full border border-white/25 bg-black/50 text-[10px] font-black uppercase tracking-widest text-white hover:border-amber-400 hover:text-amber-400 transition-all cursor-pointer"
              >
                Skip Intro
              </button>
            </div>
          )}

          {hologramPlayer && siteVisible && (
            <HologramReveal
              player={hologramPlayer}
              exiting={hologramExiting}
              onClose={() => closeHologram(false)}
              onConfirm={() => closeHologram(true)}
            />
          )}

        <div className={`bg-[#030712] text-gray-100 min-h-screen selection:bg-amber-400/50 font-sans flex flex-col relative overflow-x-hidden ${siteVisible ? "site-content--visible" : "site-content--hidden"}`}>
          {/* Toast Notification Stream */}
          {toast && (
            <div className="fixed top-24 right-6 z-[999] max-w-sm w-full animate-bounce pointer-events-auto">
              <div className="bg-[#030a1a] p-4 rounded-xl flex items-center gap-4 shadow-[0_15px_30px_rgba(0,0,0,0.8)] border border-amber-400/30">
                <div className="w-8 h-8 rounded-full bg-amber-400/20 flex items-center justify-center shrink-0">
                  <span className="text-amber-400 font-bold">GK</span>

                      onClick={() => selectPlayer(p)}
                      className={`fut-card-wrapper relative aspect-[0.7] rounded-[10%/7%] overflow-hidden cursor-pointer flex flex-col${isSelected ? " fut-card-wrapper--selected" : ""}`}

                      <div className="absolute inset-0 opacity-25 pointer-events-none mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]" />

                        <img src={selectedPlayer.flagUrl} className="w-8 rounded shadow" alt="" />

                      </div>
                    </div>

                    <div className="p-6 sm:p-8">
                      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">

                          <h3 className="font-bebas text-3xl sm:text-4xl text-white tracking-wider uppercase">{selectedPlayer.short}</h3>

                        <div className="text-center sm:text-right">
                          <span className="font-bebas text-5xl sm:text-6xl font-black text-amber-400 leading-none">

                          { index: 0, title: "Group Stage" },
                          { index: 1, title: "Round of 16" },
                          { index: 2, title: "Quarter-Finals" },
                          { index: 3, title: "Semi-Finals" },
                          { index: 4, title: "Final Match" }
                        ].map(stage => {
                          const isActive = currentStage === stage.index;
                          const isCompleted = currentStage > stage.index;
                          return (
                            <div
                              key={stage.index}
                              className={`p-3 rounded-lg border flex items-center justify-between ${
                                isActive
                                  ? "border-amber-400/50 bg-amber-400/5"

                                    ? "border-emerald-500/25 bg-emerald-950/15"
                                    : "border-white/10 bg-[#050c18]"

                              <span className="text-xs font-bold uppercase tracking-wider text-white">{stage.title}</span>

                                <span className="text-[10px] text-amber-400 font-bold animate-pulse">IN PLAY</span>

                                <span className="text-[10px] text-gray-600 font-bold">UPCOMING</span>

                        <button
                          onClick={resetTournamentSimulation}
                          className="py-3.5 px-4 rounded text-xs font-bold border border-white/15 hover:border-white bg-transparent text-white cursor-pointer"

                    { index: 0, title: "Group Stage", matches: "48 Open Matches" },
                    { index: 1, title: "Round of 16", matches: "8 Elimination Matches" },
                    { index: 2, title: "Quarter-Finals", matches: "Last 8 Standings Contenders" },
                    { index: 3, title: "Semi-Finals", matches: "Final Four Arena" },
                    { index: 4, title: "Final Match", matches: "World Cup 2026 Champion" }

                    const isActive = currentStage === stage.index;
                    const isCompleted = currentStage > stage.index;

                      <div 
                        key={stage.index}
                        className={`p-4 rounded-lg border transition-all ${

                            ? 'bg-[#030a1a] border-amber-400/50 shadow-[0_0_15px_rgba(244,197,66,0.15)]'

                        <div className="flex items-center justify-between">
                          <div>
                            <span className="text-[10px] font-bold tracking-widest uppercase block text-amber-400">STAGE {stage.index + 1}</span>
                            <h4 className="font-bebas text-xl text-white tracking-wider uppercase mt-0.5">{stage.title}</h4>
                          </div>
                          {isCompleted ? (
                            <span className="text-xs text-emerald-400 font-bold tracking-wider">COMPLETED</span>
                          ) : isActive ? (
                            <span className="text-xs text-amber-400 font-bold tracking-wider animate-pulse">LIVE GAMEPLAY</span>
                          ) : (
                            <span className="text-xs text-gray-600 font-bold tracking-wider">LOCKED</span>
                          )}
                        </div>
                        <p className="text-[11px] text-gray-400 mt-1 font-medium">{stage.matches}</p>
                      </div>
                    );
                  })}

                  {/* Simulations controls */}
                  <div className="pt-4 flex gap-4">
                    <button 
                      onClick={advanceTournamentStage}
                      disabled={currentStage >= 4}
                      className="flex-1 btn-gold py-3 px-4 rounded text-xs tracking-wider cursor-pointer disabled:opacity-50 border-none"
                    >
                      {currentStage >= 4 ? "Tournament Completed" : "Simulate Next Round"}
                    </button>
                    <button 
                      onClick={resetTournamentSimulation}
                      className="py-3 px-4 rounded text-xs font-bold border border-white/15 hover:border-white bg-transparent transition-all text-white cursor-pointer"

                      Reset
                    </button>
                  </div>
                </div>

                {/* Scoreboard (Right) */}
                <div className="lg:col-span-7 bg-[#02050c] p-6 rounded-xl border border-white/10">
                  <div className="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
                    <h3 className="font-bebas text-2xl tracking-wider text-white">GOAL STANDINGS</h3>
                    <span className="text-xs bg-[#051833] px-3 py-1 rounded border border-white/10 font-bold text-amber-400">LIVE DRAFT TRACKER</span>
                  </div>

                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-2">
                    {sortedScoreboard.map((item, idx) => {
                      const isUserBacking = selectedPlayer?.short === item.name;
                      return (
                        <div 
                          key={item.name}
                          className={`p-3 rounded-lg flex items-center justify-between transition-all ${
                            isUserBacking 
                              ? 'bg-amber-400/10 border border-amber-400/35 shadow-[0_4px_12px_rgba(244,197,66,0.1)]' 
                              : 'bg-[#050c18] border border-white/5'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-sm font-bold text-gray-400 w-5">{idx + 1}</span>
                            <img src={item.flag} className="w-6 rounded shadow-sm" alt="" />
                            <div>
                              <span className="text-xs font-bold text-white uppercase tracking-wider block">
                                {item.name} {isUserBacking && <span className="text-[10px] text-amber-400 font-black ml-1.5">(BACKED BY YOU)</span>}
                              </span>
                              <span className="text-[9px] text-gray-500 font-medium">Competitor: {item.rating} OVR rating</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-4">
                            <span className="font-bebas text-2xl font-black text-amber-400">{item.goals} GOALS</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
              )}

            </div>
          </section>

          {/* ─── SPONSORS MATRIX (Match references) ─────────────── */}
          <section id="sponsors" className="py-16 relative z-20 bg-[#030712] border-t border-b border-white/10 select-none">
            <div className="max-w-7xl mx-auto px-6">
              
              <div className="text-center mb-8">
                <span className="text-[10px] font-black text-gray-500 uppercase tracking-widest block">OFFICIAL SUPPORT BRANDS</span>
                <h3 className="font-bebas text-2xl tracking-wider text-amber-400 uppercase mt-1">FIFA PARTNER NETWORK</h3>
              </div>

              <div className="grid grid-cols-3 sm:grid-cols-5 gap-4 max-w-5xl mx-auto">
                {SPONSORS.map((sponsor) => (
                  <div key={sponsor.id} className="sponsor-card" title={sponsor.name}>
                    <img
                      src={sponsor.logo}
                      alt={sponsor.name}
                      className="sponsor-logo"
                      loading="lazy"
                    />
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ─── FOOTER FEATURE BAR ────────────────────────────── */}
          <footer className="bg-[#02050c] text-white/50 border-t border-white/10 mt-auto">
            
            <div className="max-w-7xl mx-auto px-6 py-10 grid grid-cols-2 md:grid-cols-4 gap-6 border-b border-white/10 text-xs text-center md:text-left">
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">PREDICT & WIN</span>
                <p className="text-[10px] text-gray-500 mt-0.5">Secure draft verification slots for premium matches.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">EXCLUSIVE REWARDS</span>
                <p className="text-[10px] text-gray-500 mt-0.5">Cars, luxury hotel stays, and verified cash sweepstakes.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">SECURE & FAIR</span>
                <p className="text-[10px] text-gray-500 mt-0.5">100% verified prediction engines under official compliance rules.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">24/7 SUPPORT</span>
                <p className="text-[10px] text-gray-500 mt-0.5">Reach our dedicated game prediction representatives anytime.</p>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between text-[10px] font-bold text-gray-500 uppercase tracking-widest gap-4">
              <span>© 2026 GOALKING BRACKETS DRAFT. NOT DIRECTLY AFFILIATED WITH FIFA OR REAL FEDERATIONS.</span>
              <div className="flex gap-6">
                <a href="#featured-players" className="hover:text-white">TERMS OF USE</a>
                <a href="#featured-players" className="hover:text-white">PRIVACY AUDIT</a>
                <a href="#featured-players" className="hover:text-white">OFFICIAL RULES</a>
              </div>
            </div>

          </footer>

        </div>
        </>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
