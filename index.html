<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup GoalKing 2026</title>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var base = "/";
      if (window.location.hostname.endsWith("github.io") && path.indexOf("/-/") === 0) {
        base = "/-/";
      }
      var tag = document.createElement("base");
      tag.href = base;
      document.head.appendChild(tag);
      window.__ASSET_BASE__ = base;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="logo.svg" />
  
  <!-- CDNs for Live React & Tailwind Environment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    .font-cond { font-family: 'Barlow Condensed', sans-serif; }
    .font-sans { font-family: 'Barlow', sans-serif; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 6rem;
      background-color: #030712;
    }

    #hero,
    #featured-players,
    #tokens {
      scroll-margin-top: 6rem;
    }

    .tokens-section-rule {
      width: 4.5rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(244, 197, 66, 0.9), transparent);
    }

    .tokens-pack-card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .tokens-pack-card:hover {
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
    }
    
    /* Premium Glassmorphic Broadcast Panel Styling */
    .glass-panel-gold {
      background: rgba(3, 11, 26, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(244, 197, 66, 0.2);
      box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.8);
    }

    .text-neon-gold {
      color: #f4c542;
      text-shadow: 0 0 12px rgba(244, 197, 66, 0.45);
    }

    .gold-glow-border:focus {
      border-color: #f4c542 !important;
      box-shadow: 0 0 15px rgba(244, 197, 66, 0.4) !important;
      outline: none;
    }

    .btn-gold {
      background: linear-gradient(90deg, #f4c542, #c8991e);
      color: #030712;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(244, 197, 66, 0.5);
      filter: brightness(1.15);
    }

    .payment-method-tab {
      flex: 1;
      padding: 0.625rem 0;
      border-radius: 0.375rem;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #9CA3AF;
    }

    .payment-method-tab:hover:not(.payment-method-tab--active) {
      color: #f4c542;
      border-color: rgba(244, 197, 66, 0.35);
      background: rgba(244, 197, 66, 0.08);
      box-shadow: 0 0 18px rgba(244, 197, 66, 0.15);
      transform: translateY(-1px);
    }

    .payment-method-tab--active {
      background: #f4c542;
      color: #030712;
      box-shadow: 0 0 20px rgba(244, 197, 66, 0.35);
    }

    .payment-method-tab--active:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 28px rgba(244, 197, 66, 0.5);
      transform: translateY(-1px);
    }

    .stake-pack-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .stake-pack-card:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .stake-pack-card--featured:hover {
      border-color: #f4c542 !important;
      box-shadow: 0 18px 40px rgba(244, 197, 66, 0.28) !important;
    }

    .stake-pack-card:not(.stake-pack-card--featured):hover {
      border-color: rgba(244, 197, 66, 0.45) !important;
      box-shadow: 0 14px 32px rgba(244, 197, 66, 0.14);
    }

    .stake-pack-card:hover .stake-pack-value {
      color: #f4c542;
      text-shadow: 0 0 14px rgba(244, 197, 66, 0.45);
    }

    .entry-celebration-overlay {
      animation: celebrationFadeIn 0.45s ease-out;
    }

    .entry-celebration-card {
      animation: celebrationPop 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .entry-celebration-coin {
      width: 88px;
      height: 88px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, #fff, #f4c542 52%, #8a6414 100%);
      box-shadow: 0 0 35px rgba(244, 197, 66, 0.55);
      animation: celebrationCoinPulse 2.2s ease-in-out infinite;
    }

    @keyframes celebrationFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes celebrationPop {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes celebrationCoinPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(244, 197, 66, 0.55); }
      50% { transform: scale(1.06); box-shadow: 0 0 50px rgba(244, 197, 66, 0.75); }
    }

    /* 3D Coin Rotation */
    @keyframes rotateCoin {
      0% { transform: translateY(0) rotateY(0deg) scale(1); }
      50% { transform: translateY(-12px) rotateY(180deg) scale(1.05); }
      100% { transform: translateY(0) rotateY(360deg) scale(1); }
    }

    .animated-coin-bg {
      animation: rotateCoin 6s ease-in-out infinite;
    }

    /* FUT Cards Hover Breakout */
    .fut-card-wrapper {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }
    .fut-card-wrapper:hover {
      transform: translateY(-14px) scale(1.03);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    .sponsor-card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 5rem;
      padding: 1rem 1.25rem;
      background: rgba(9, 9, 11, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }

    .sponsor-card:hover {
      border-color: rgba(244, 197, 66, 0.25);
      background: rgba(24, 24, 27, 0.8);
      transform: translateY(-2px);
    }

    .sponsor-logo {
      height: 2rem;
      width: auto;
      max-width: 6.5rem;
      object-fit: contain;
      opacity: 0.55;
      transition: all 0.3s ease;
    }

    .sponsor-card:hover .sponsor-logo {
      opacity: 1;
      transform: scale(1.06);
    }

    .mzansi-side-blend {
      position: absolute;
      top: 0;
      bottom: 0;
      width: min(34vw, 460px);
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .mzansi-side-blend img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
    }

    .mzansi-side-blend--left img {
      object-position: 70% center;
      mask-image: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
    }

    .mzansi-side-blend--right img {
      object-position: 30% center;
      mask-image: linear-gradient(to left, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
    }

    .mzansi-flag-stripe {
      height: 4px;
      background: linear-gradient(90deg, #007A4D 0%, #007A4D 20%, #FFB612 20%, #FFB612 40%, #000000 40%, #000000 55%, #007A4D 55%, #007A4D 75%, #DE3831 75%, #DE3831 90%, #002395 90%, #002395 100%);
    }

    .mzansi-glow {
      background: radial-gradient(ellipse at 20% 50%, rgba(0, 122, 77, 0.18) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 50%, rgba(255, 182, 18, 0.12) 0%, transparent 55%);
    }

    .section-stadium-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .section-stadium-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
    }

    .section-stadium-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 5, 12, 0.92) 0%, rgba(2, 5, 12, 0.82) 45%, rgba(2, 5, 12, 0.94) 100%);
    }

    .section-blend-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .section-blend-bg__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.12);
      filter: blur(3px) saturate(0.7) brightness(0.55) contrast(1.05);
      opacity: 0.18;
    }

    .section-blend-bg__img--left { object-position: 18% center; }
    .section-blend-bg__img--right { object-position: 82% center; }
    .section-blend-bg__img--top { object-position: center 20%; }
    .section-blend-bg__img--bottom { object-position: center 80%; }

    .section-blend-bg--soft .section-blend-bg__img {
      opacity: 0.12;
      filter: blur(4px) saturate(0.6) brightness(0.5);
    }

    .section-blend-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(3, 7, 18, 0.9) 0%, rgba(3, 7, 18, 0.68) 48%, rgba(3, 7, 18, 0.92) 100%),
        radial-gradient(ellipse at 50% 40%, rgba(0, 122, 77, 0.06) 0%, transparent 55%);
    }

    .section-blend-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(3, 7, 18, 0.45) 100%);
    }

    .section-blend-bg--sweepstakes .section-blend-bg__img {
      opacity: 0.32;
      filter: blur(1.5px) saturate(1.15) brightness(0.62) contrast(1.1);
      transform: scale(1.08);
      object-position: center center;
    }

    .section-blend-bg--sweepstakes .section-blend-overlay {
      background:
        linear-gradient(180deg, rgba(3, 7, 18, 0.86) 0%, rgba(3, 7, 18, 0.48) 45%, rgba(3, 7, 18, 0.9) 100%),
        radial-gradient(ellipse at 50% 28%, rgba(244, 197, 66, 0.1) 0%, transparent 52%);
    }

    .prize-sweepstakes-visual {
      position: relative;
      max-width: 56rem;
      margin: 0 auto 2.5rem;
      height: 10.5rem;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgba(244, 197, 66, 0.22);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .prize-sweepstakes-visual__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.08) brightness(0.82) contrast(1.05);
    }

    .prize-sweepstakes-visual__fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(3, 10, 26, 0.94) 0%, rgba(3, 10, 26, 0.15) 22%, rgba(3, 10, 26, 0.15) 78%, rgba(3, 10, 26, 0.94) 100%),
        linear-gradient(180deg, rgba(3, 10, 26, 0.55) 0%, transparent 38%, transparent 62%, rgba(3, 10, 26, 0.8) 100%);
      pointer-events: none;
    }

    @media (min-width: 640px) {
      .prize-sweepstakes-visual {
        height: 13rem;
      }
    }

    .payfast-demo-overlay {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(0, 63, 135, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(215, 25, 32, 0.08) 0%, transparent 50%),
        linear-gradient(160deg, #e8edf4 0%, #f8fafc 45%, #dfe6ef 100%);
      color: #1f2937;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      perspective: 1200px;
    }

    .payfast-demo-shell {
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow:
        0 2px 0 rgba(255, 255, 255, 0.95) inset,
        0 28px 60px rgba(15, 23, 42, 0.22),
        0 8px 20px rgba(0, 63, 135, 0.12);
      max-width: 540px;
      transform: translateZ(0);
      animation: payfastDemoShellIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes payfastDemoShellIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .payfast-demo-portfolio-tag {
      background: linear-gradient(90deg, #fff7ed, #ffedd5, #fff7ed);
      border-bottom: 1px solid #fdba74;
      color: #9a3412;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.45rem 0.75rem;
    }

    .payfast-demo-header {
      background: linear-gradient(135deg, #152a4a 0%, #1e3a5f 55%, #0f2440 100%);
      color: #ffffff;
      padding: 1.1rem 1.35rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      border-bottom: 3px solid rgba(215, 25, 32, 0.85);
    }

    .payfast-demo-header-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .payfast-demo-header-sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      font-style: normal;
      opacity: 0.88;
      margin-top: 0.2rem;
      letter-spacing: 0.04em;
    }

    .payfast-demo-header-total {
      text-align: right;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.82);
    }

    .payfast-demo-header-total strong {
      display: block;
      font-size: 1.2rem;
      color: #fff;
      font-weight: 800;
      margin-top: 0.15rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .payfast-demo-brand {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      font-style: italic;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .payfast-demo-brand-pay {
      color: #ff2a35;
      font-style: italic;
    }

    .payfast-demo-brand-fast {
      color: #4da3ff;
      font-style: italic;
    }

    .payfast-demo-brand-sm {
      font-size: 1.05rem;
    }

    .payfast-demo-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: linear-gradient(180deg, #f1f5f9 0%, #e8eef5 100%);
      border-bottom: 1px solid #cbd5e1;
      padding: 0 0.5rem;
    }

    .payfast-demo-step {
      position: relative;
      padding: 0.7rem 0.35rem 0.65rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      border-bottom: 3px solid transparent;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .payfast-demo-step::after {
      content: "";
      position: absolute;
      right: 0;
      top: 25%;
      height: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, #cbd5e1, transparent);
    }

    .payfast-demo-step:last-child::after {
      display: none;
    }

    .payfast-demo-step--active {
      color: #003f87;
      border-bottom-color: #d71920;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, transparent 100%);
    }

    .payfast-demo-step--done {
      color: #0f766e;
    }

    .payfast-demo-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #cbd5e1 15%, #94a3b8 50%, #cbd5e1 85%, transparent);
      margin: 0.85rem 0 1rem;
    }

    .payfast-demo-divider-label {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.85rem;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .payfast-demo-divider-label::before,
    .payfast-demo-divider-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #cbd5e1);
    }

    .payfast-demo-divider-label::after {
      background: linear-gradient(90deg, #cbd5e1, transparent);
    }

    .payfast-demo-body {
      padding: 1.15rem 1.35rem 0.65rem;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .payfast-demo-subtitle {
      color: #475569;
      font-size: 0.92rem;
      margin-bottom: 0.85rem;
      font-weight: 500;
    }

    .payfast-demo-method {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      margin-bottom: 0.7rem;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 4px 12px rgba(15, 23, 42, 0.06);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .payfast-demo-method::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #d71920, #003f87);
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .payfast-demo-method:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: #94a3b8;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 14px 28px rgba(0, 63, 135, 0.14);
    }

    .payfast-demo-method:hover::before {
      opacity: 1;
    }

    .payfast-demo-method-label {
      color: #0f172a;
      font-size: 0.96rem;
      font-weight: 600;
    }

    .payfast-demo-method-logos {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .payfast-demo-card-panel {
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.1rem 1.15rem;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .payfast-demo-footer {
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      border-top: 1px solid #e2e8f0;
      padding: 0.95rem 1rem 1.05rem;
      text-align: center;
      font-size: 0.76rem;
      color: #64748b;
      box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
    }

    .payfast-demo-secure-lock {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.68rem;
      color: #0f766e;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
    }

    .payfast-demo-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.72rem 0.85rem;
      font-size: 0.94rem;
      color: #0f172a;
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04) inset;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .payfast-demo-input:focus {
      outline: none;
      border-color: #003f87;
      box-shadow: 0 0 0 3px rgba(0, 63, 135, 0.12);
    }

    .payfast-demo-label {
      display: block;
      font-size: 0.78rem;
      color: #475569;
      margin-bottom: 0.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .payfast-demo-pay-btn {
      background: linear-gradient(180deg, #ef2333 0%, #d71920 48%, #b9151b 100%);
      color: #fff;
      font-weight: 800;
      border: none;
      width: 100%;

    function createHoloAudioSession(player, isMutedRef) {
      const active = [];
      const timers = [];

      const playClip = (src, { volume = 1, loop = false, delay = 0 } = {}) => {
        if ((isMutedRef && isMutedRef.current) || !src) return null;
        const audio = new Audio(src);
        audio.volume = volume;
        audio.loop = loop;
        audio.preload = "auto";
        active.push(audio);
        const timer = setTimeout(() => {
          audio.play().catch(() => {});
        }, delay);
        timers.push(timer);
        return audio;
      };

      const fadeOutAll = (duration = 450) => {
        timers.forEach(clearTimeout);
        active.forEach((audio) => {
          const start = audio.volume;
          const steps = 8;
          let step = 0;
          const interval = setInterval(() => {
            step += 1;
            audio.volume = Math.max(0, start * (1 - step / steps));
            if (step >= steps) {
              clearInterval(interval);
              audio.pause();
            }
          }, duration / steps);
        });
        setTimeout(() => {
          active.forEach((audio) => audio.pause());
          active.length = 0;
        }, duration + 40);
      };

      const speakFallback = () => {
        if ((isMutedRef && isMutedRef.current) || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const line = new SpeechSynthesisUtterance(`${player.name}!`);
        line.rate = 1.02;
        line.pitch = 0.92;
        const voices = window.speechSynthesis.getVoices();
        const voice = voices.find(v => /Thomas|Ryan|George/i.test(v.name)) || voices.find(v => v.lang.startsWith("en")) || voices[0];
        if (voice) line.voice = voice;
        window.speechSynthesis.speak(line);
      };

        const isStriker = player.cat === "striker";
        const roarVol = isSiuu ? 0.95 : isStriker ? 0.82 : 0.62;
        const cheerVol = isSiuu ? 0.92 : isStriker ? 0.75 : 0.55;

        if (isStriker) {
          playClip(STADIUM_SOUNDS.kick, { volume: 0.45 });
        }
        playClip(STADIUM_SOUNDS.crowdChant, { volume: roarVol * 0.55, delay: 80 });

        timers.push(setTimeout(() => playClip(STADIUM_SOUNDS.crowdCheer, { volume: cheerVol }), isSiuu ? 320 : 200));
      };

          timers.push(setTimeout(triggerGoalMoment, 1800));
        }

        playClip(STADIUM_SOUNDS.crowdChant, { volume: 0.6, delay: 100 });

    async function ensureUserProfile(firebaseUser, username = null) {
      if (!firebaseDb) return null;

      if (!snap.exists) {
        const profile = {
          email: firebaseUser.email,
          username: username
            || firebaseUser.displayName
            || (firebaseUser.email ? firebaseUser.email.split("@")[0].toUpperCase() : "CONTESTANT"),

          selectedPlayerId: null,
        };
        await ref.set(profile);
        return profile;
      }

      return snap.data();

    function HologramReveal({ player, exiting, onClose, onConfirm }) {
      const config = TIER_CONFIG[player.tier] || TIER_CONFIG.GOLD;
      const gestureKey = PLAYER_GESTURES[player.id] || (player.cat === "striker" ? "thumbs" : "wink");
      const gesture = GESTURE_CONFIG[gestureKey];
      const motionClass = player.cat === "striker" ? "holo-motion-wrap--sprint" : "holo-motion-wrap--dribble";
      const [soundOn, setSoundOn] = useState(() => sessionStorage.getItem("holoSoundOn") !== "0");
      const audioSessionRef = useRef(null);
      const soundMutedRef = useRef(!soundOn);
      soundMutedRef.current = !soundOn;
      const particles = useRef(
        Array.from({ length: 14 }, (_, i) => ({
          id: i,
          left: `${8 + (i * 6.2) % 84}%`,
          top: `${12 + (i * 11) % 70}%`,
          delay: `${(i * 0.35) % 2.5}s`,
          duration: `${2.2 + (i % 3) * 0.6}s`,
        }))
      );

      useEffect(() => {
        const prev = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = prev; };
      }, []);

      useEffect(() => {
        if (exiting) return undefined;
        if (audioSessionRef.current) audioSessionRef.current.fadeOutAll(120);
        const session = createHoloAudioSession(player, soundMutedRef);
        audioSessionRef.current = session;
        session.start();
        return () => session.fadeOutAll(300);
      }, [player.id, exiting]);

      useEffect(() => {
        if (exiting && audioSessionRef.current) {
          audioSessionRef.current.fadeOutAll(280);
        }
      }, [exiting]);

      const toggleSound = () => {
        setSoundOn((prev) => {
          const next = !prev;
          sessionStorage.setItem("holoSoundOn", next ? "1" : "0");
          if (!next) audioSessionRef.current?.fadeOutAll(220);
          return next;
        });
      };

      const handleConfirm = () => {
        audioSessionRef.current?.confirm();
        onConfirm();
      };

      return (
        <div
          className={`holo-overlay${exiting ? " holo-overlay--exit" : ""}`}
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={`${player.name} hologram reveal`}
        >
          <div className="holo-stage" onClick={e => e.stopPropagation()}>
            <div className="holo-frame">
              <button type="button" className="holo-close" onClick={onClose} aria-label="Close hologram">
                <SVGIcons.Close />
              </button>
              <button
                type="button"
                className="holo-close"
                style={{ right: "3.25rem" }}
                onClick={toggleSound}
                aria-label={soundOn ? "Mute stadium sounds" : "Unmute stadium sounds"}
                title={soundOn ? "Mute sounds" : "Unmute sounds"}
              >
                {soundOn ? <SVGIcons.SoundOn /> : <SVGIcons.SoundOff />}
              </button>

              <div className="holo-arena">
                <div className="holo-particles">
                  {particles.current.map(pt => (
                    <span
                      key={pt.id}
                      className="holo-particle"
                      style={{ left: pt.left, top: pt.top, animationDelay: pt.delay, animationDuration: pt.duration }}
                    />
                  ))}
                </div>
                <div className="holo-grid" />
                <div className="holo-club-beacon">
                  <img src={player.clubUrl} alt="" />
                </div>

                <div className="holo-badge">
                  <img src={player.flagUrl} className="w-4 rounded-sm" alt="" />
                  <span>HOLO PROJECTION</span>
                </div>

                <div className="holo-gesture" title={gesture.label}>
                  <span className="holo-gesture-icon" aria-hidden="true">{gesture.emoji}</span>
                  <span className="text-[10px] font-bold text-cyan-200 max-w-[9rem] leading-tight">{gesture.message}</span>
                </div>

                <div className="holo-figure-wrap">
                  <div className={`holo-motion-wrap ${motionClass}`}>
                    <img src={player.imageUrl} alt="" className="holo-figure-ghost holo-figure-ghost--cyan" aria-hidden="true" />
                    <img src={player.imageUrl} alt="" className="holo-figure-ghost holo-figure-ghost--magenta" aria-hidden="true" />
                    <img src={player.imageUrl} alt={player.name} className="holo-figure" />
                  </div>
                </div>

                <div className="holo-scanlines" />
              </div>

              <div className="holo-footer">
                <p className="text-[10px] font-bold uppercase tracking-[0.2em] text-cyan-300/80 mb-1">Player Materialized</p>
                <h3 className="font-bebas text-3xl text-white tracking-wider uppercase" style={{ color: config.textAccent }}>
                  {player.short}
                </h3>
                <p className="text-xs text-gray-400 mt-1">{player.name} · {player.pos} · {player.nat} · {player.rating} OVR</p>
                <p className="text-[10px] text-gray-500 mt-2 uppercase tracking-wider">
                  {player.cat === "striker" ? "Sprint hologram active" : "Dribble hologram active"} · Stadium audio live
                </p>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className="btn-gold mt-5 w-full py-3.5 rounded-lg text-xs tracking-widest cursor-pointer border-none"
                >
                  Lock In {player.short}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

        try {
          if (EXPERIMENTAL_VOUCHERS) {
            await new Promise((resolve) => setTimeout(resolve, 500));

            const pin = voucherPin.replace(/\s+/g, "").trim();
            addExperimentalTokens(currentUser.uid, paymentPack.tokens);
            const profile = firebaseDb ? await loadUserProfile(currentUser.uid) : null;
            const firestoreTokens = profile?.tokens ?? 0;
            const newBalance = firestoreTokens + loadExperimentalTokens(currentUser.uid);
            const credited = paymentPack.tokens;

            if (firebaseDb) {
              try {
                await logTestRedemptionToFirestore({
                  provider,
                  pack: paymentPack,
                  pin,
                  newBalance,
                  user: currentUser,
                  player: pendingLockPlayer,
                });
              } catch (logError) {
                console.warn("Could not log test redemption for admin dashboard:", logError);
              }
            }

            setCurrentUser((prev) => (prev ? { ...prev, tokens: newBalance } : prev));
            closePaymentModal();
            setEntryCelebration({
              packName: `${paymentPack.name} Coin Pack`,
              tokens: credited,
              newBalance,
              provider,
              amount: paymentPack.value.replace("R", ""),
              experimental: true,
              player: pendingLockPlayer,
            });
            return;
          }

          const pin = voucherPin.replace(/\s+/g, "").trim();
          if (!pin) {
            setPaymentError("Enter your voucher PIN.");
            return;
          }

          const redeemVoucherFn = firebaseFunctions.httpsCallable("redeemVoucher");
          const result = await redeemVoucherFn({
            provider,
            packId: paymentPack.id,
            pin,
            mobile: provider === "ott" ? voucherMobile.trim() || undefined : undefined,
          });

          const data = result?.data || {};
          const credited = data.tokens ?? paymentPack.tokens;
          const newBalance = data.newBalance ?? ((currentUser?.tokens ?? 0) + credited);

          await setUserFromFirebase(firebaseAuth.currentUser);
          setCurrentUser((prev) => (prev ? { ...prev, tokens: newBalance } : prev));

          closePaymentModal();
          setEntryCelebration({
            packName: data.packName || `${paymentPack.name} Coin Pack`,
            tokens: credited,
            newBalance,
            provider,
            amount: data.amount || paymentPack.value.replace("R", ""),
            email: data.email || currentUser?.email || null,
            emailSent: Boolean(data.emailSent),
            sandbox: Boolean(data.sandbox),
            player: pendingLockPlayer,
          });
        } catch (error) {
          setPaymentError(mapPurchaseError(error));
        } finally {
          setPurchasingPackId(null);
        }
      };

      const handleEmailSignUp = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        if (!authEmail || !authPassword || !authUsername) {
          setAuthError("All fields are required to create a GoalKing profile.");
          return;
        }

        if (authPassword.length < 6) {
          setAuthError("Password must be at least 6 characters.");
          return;
        }

        setAuthSubmitting(true);
        setShowResendVerification(false);
        try {
          const credential = await firebaseAuth.createUserWithEmailAndPassword(authEmail, authPassword);
          await ensureUserProfile(credential.user, authUsername.trim().toUpperCase());
          await credential.user.sendEmailVerification(emailVerificationSettings);
          await firebaseAuth.signOut();
          markRegisteredVisitor();
          setIntroSeen(true);
          setAuthMode("login");
          setAuthPassword("");
          setAuthUsername("");
          setAuthSuccess(`Confirmation email sent to ${authEmail}. Open the link in your inbox, then log in.`);
          showToast("Check your inbox to verify your email.", "info");
        } catch (error) {
          if (error?.code === "auth/email-already-in-use") {
            setAuthError("");
            setShowRegisteredSpamNotice(true);
          } else {
            setAuthError(mapAuthError(error));
          }
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleEmailLogIn = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        if (!authEmail || !authPassword) {
          setAuthError("Please input your registered email address and password.");
          return;
        }

        setAuthSubmitting(true);
        setShowResendVerification(false);
        try {
          const credential = await firebaseAuth.signInWithEmailAndPassword(authEmail, authPassword);
          await credential.user.reload();
          const isPasswordAccount = credential.user.providerData.some((p) => p.providerId === "password");

          if (isPasswordAccount && !credential.user.emailVerified) {
            await firebaseAuth.signOut();
            setAuthError(`Please verify your email first. We sent a confirmation link to ${authEmail}.`);
            setShowResendVerification(true);
            return;
          }

          const profile = await loadUserProfile(credential.user.uid);
          await setUserFromFirebase(credential.user);
          markRegisteredVisitor();
          setIntroSeen(true);
          setShowWelcomeBack(false);
          const displayName = profile?.username || authEmail.split("@")[0].toUpperCase();
          setAuthSuccess("Login successful! Welcome back.");
          showToast(`Logged in as ${displayName}`);
          setTimeout(closeAuthModal, 1200);
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleForgotPassword = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        if (!authEmail) {
          setAuthError("Enter the email address linked to your GoalKing profile.");
          return;
        }

        setAuthSubmitting(true);
        try {
          await firebaseAuth.sendPasswordResetEmail(authEmail, passwordResetSettings);
          setAuthSuccess(`Password reset link sent to ${authEmail}. Check your inbox and spam folder.`);
          showToast("Reset link sent. Check your email.", "info");
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleConfirmPasswordReset = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        if (!resetOobCode) {
          setAuthError("This reset link is invalid. Request a new password reset email.");
          return;
        }

        if (newPassword.length < 6) {
          setAuthError("Password must be at least 6 characters.");
          return;
        }

        if (newPassword !== confirmPassword) {
          setAuthError("Passwords do not match. Please try again.");
          return;
        }

        setAuthSubmitting(true);
        try {
          await firebaseAuth.confirmPasswordReset(resetOobCode, newPassword);
          const credential = await firebaseAuth.signInWithEmailAndPassword(resetEmail, newPassword);
          await setUserFromFirebase(credential.user);
          const profile = await loadUserProfile(credential.user.uid);
          const displayName = profile?.username || resetEmail.split("@")[0].toUpperCase();
          setAuthSuccess("Password updated. Welcome back!");
          showToast(`Logged in as ${displayName}`);
          setTimeout(closeAuthModal, 1200);
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleResendVerification = async () => {
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        if (!authEmail || !authPassword) {
          setAuthError("Enter your email and password above, then resend the verification email.");
          return;
        }

        setAuthSubmitting(true);
        try {
          const credential = await firebaseAuth.signInWithEmailAndPassword(authEmail, authPassword);
          await credential.user.reload();

          if (credential.user.emailVerified) {
            const profile = await loadUserProfile(credential.user.uid);
            await setUserFromFirebase(credential.user);
            setShowResendVerification(false);
            setAuthSuccess("Your email is already verified. You're logged in!");
            showToast(`Welcome back, ${profile?.username || authEmail.split("@")[0].toUpperCase()}!`);
            setTimeout(closeAuthModal, 1200);
            return;
          }

          await credential.user.sendEmailVerification(emailVerificationSettings);
          await firebaseAuth.signOut();
          setAuthSuccess(`Verification email resent to ${authEmail}. Check your inbox and spam folder.`);
          showToast("Verification email sent again.", "info");
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleGoogleSignIn = async () => {
        setAuthError("");
        setAuthSuccess("");

        if (!firebaseAuth) {
          setAuthError("Firebase is not configured yet. Add keys locally to public/firebase-config.js or set GitHub Secrets for deploy.");
          return;
        }

        setAuthSubmitting(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const credential = await firebaseAuth.signInWithPopup(provider);
          const profile = await ensureUserProfile(credential.user);
          await setUserFromFirebase(credential.user);
          markRegisteredVisitor();
          setIntroSeen(true);
          setShowWelcomeBack(false);
          setAuthSuccess("Signed in with Google.");

          setTimeout(closeAuthModal, 1200);
        } catch (error) {
          setAuthError(mapAuthError(error));
        } finally {
          setAuthSubmitting(false);
        }
      };

      const handleSignOut = async () => {
        try {

            await firebaseAuth.signOut();
          } else {
            setCurrentUser(null);
          }

          showToast(mapAuthError(error), "info");

        setTimeout(() => {

      const advanceTournamentStage = () => {
        if (currentStage >= 4) {

        const nextStageIndex = currentStage + 1;
        const roundNames = ["Group Stage", "Round of 16", "Quarter-Finals", "Semi-Finals", "Final"];
        let backedGoalsAdded = 0;
        
        setPlayerScores(prev => {
          const updated = { ...prev };
          Object.keys(updated).forEach(pName => {
            const playerObj = PLAYERS.find(p => p.short === pName);
            const isBacked = selectedPlayer && pName === selectedPlayer.short;
            const bias = playerObj ? (playerObj.rating - 80) / 4 : 2;
            let goalsAdded = Math.max(0, Math.floor(Math.random() * 3) + Math.floor(bias * 0.45));
            if (isBacked) {
              goalsAdded += Math.floor(Math.random() * 2) + 1;
              backedGoalsAdded = goalsAdded;
            }
            if (!simulationFocus) {
              updated[pName] += goalsAdded;
            } else if (isBacked) {
              updated[pName] += goalsAdded;
            }
          });
          return updated;
        });

        if (simulationFocus && selectedPlayer) {
          setLastRoundGoals(backedGoalsAdded);
        }

        setCurrentStage(nextStageIndex);
        if (simulationFocus && selectedPlayer) {
          showToast(`${selectedPlayer.short} scored +${backedGoalsAdded} goals in ${roundNames[nextStageIndex]}!`);
        } else {
          showToast(`Simulation completed for: ${roundNames[nextStageIndex]}`);
        }
      };

      const resetTournamentSimulation = () => {
        setPlayerScores(Object.fromEntries(PLAYERS.map(p => [p.short, 0])));
        setCurrentStage(0);
        setLastRoundGoals(0);
        showToast("Leaderboard standings reset to opening group matches.", "info");
      };

      const filteredPlayers = filter === "all" ? PLAYERS : PLAYERS.filter(p => p.cat === filter);

      const sortedScoreboard = Object.entries(playerScores)
        .map(([name, goals]) => {
          const pData = PLAYERS.find(p => p.short === name);
          return { name, goals, flag: pData?.flagUrl || "", rating: pData?.rating || 90 };
        })
        .sort((a, b) => b.goals - a.goals);

      return (
        <>
          {showIntro && (
            <div className={`intro-splash ${introExiting ? "intro-splash--out intro-splash--flash" : ""}`}>
              <div className="intro-splash__frame">
                <video

                  src={assetPath("goalking.mp4")}
                  playsInline
                  preload="auto"
                  muted
                  onPlay={() => setIntroPlaying(true)}
                  onEnded={dismissIntro}
                  onError={dismissIntro}
                />
                {!introPlaying && (
                  <button
                    type="button"
                    onClick={playIntroVideo}
                    className="intro-play-btn"
                    aria-label="Play intro video"
                  >
                    <span className="intro-play-btn__circle">
                      <svg width="30" height="30" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5v14l11-7z" />
                      </svg>
                    </span>
                  </button>
                )}
              </div>
              <button
                onClick={dismissIntro}
                className="absolute bottom-6 right-6 sm:bottom-8 sm:right-8 z-10 px-5 py-2.5 rounded-full border border-white/25 bg-black/50 text-[10px] font-black uppercase tracking-widest text-white hover:border-amber-400 hover:text-amber-400 transition-all cursor-pointer"
              >
                Skip Intro
              </button>
            </div>

          {hologramPlayer && siteVisible && (
            <HologramReveal
              player={hologramPlayer}
              exiting={hologramExiting}
              onClose={() => closeHologram(false)}
              onConfirm={() => closeHologram(true)}
            />
          )}

          {siteVisible && !showIntro && introSeen && (
            <button
              type="button"
              className="intro-bubble"
              onClick={openIntroFromBubble}
              aria-label="Watch GoalKing intro video"
            >
              <span className="intro-bubble__label">Watch intro</span>
              <video
                ref={introBubbleVideoRef}
                className="intro-bubble__video"
                src={assetPath("goalking.mp4")}
                muted
                playsInline
                preload="metadata"
              />
              <span className="intro-bubble__play" aria-hidden="true">
                <span>
                  <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                </span>
              </span>
            </button>
          )}

        <div className={`bg-[#030712] text-gray-100 min-h-screen selection:bg-amber-400/50 font-sans flex flex-col relative overflow-x-hidden ${siteVisible ? "site-content--visible" : "site-content--hidden"}`}>
          {showWelcomeBack && !currentUser && siteVisible && (
            <div className="welcome-back-banner">
              <span className="text-[11px] sm:text-xs text-gray-200 font-semibold">
                Welcome back — sign in to pick players and buy tokens.
              </span>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onClick={() => {
                    setAuthMode("login");
                    setAuthSuccess("Welcome back! Sign in to your GoalKing profile.");
                    setIsAuthModalOpen(true);
                  }}
                  className="btn-gold text-[9px] sm:text-[10px] uppercase tracking-wider font-extrabold px-3 py-1.5 sm:px-4 sm:py-2 rounded border-0"
                >
                  Log in
                </button>
                <button
                  type="button"
                  onClick={() => setShowWelcomeBack(false)}
                  className="text-gray-400 hover:text-white text-sm bg-transparent border-0 cursor-pointer"
                  aria-label="Dismiss welcome banner"
                >
                  ×
                </button>
              </div>
            </div>
          )}

          {/* Toast Notification Stream */}
          {toast && (
            <div className="fixed top-24 right-6 z-[999] max-w-sm w-full animate-bounce pointer-events-auto">
              <div className="bg-[#030a1a] p-4 rounded-xl flex items-center gap-4 shadow-[0_15px_30px_rgba(0,0,0,0.8)] border border-amber-400/30">
                <div className="w-8 h-8 rounded-full bg-amber-400/20 flex items-center justify-center shrink-0">

          {/* ─── EMAIL AUTHORIZATION MODAL ────────────────────── */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">

                      <>SIGN IN TO <span className="text-neon-gold">GOALKING PROFILE</span></>
                    ) : (
                      <>CREATE YOUR <span className="text-neon-gold">GOALKING PROFILE</span></>

                  {authMode === "signup" && (
                    <div>

                      <div className="relative">
                        <span className="absolute left-3.5 top-3 text-gray-500"><SVGIcons.User /></span>
                        <input

                        {authMode === "login" && (

                              setAuthSuccess("");

                            className="text-[10px] font-bold text-amber-400 hover:text-amber-300 uppercase tracking-wider bg-transparent border-0 cursor-pointer"

                        <input

                          placeholder="••••••••"
                          className="w-full bg-[#050c18] border border-white/15 rounded-lg py-3 pl-11 pr-4 text-sm text-white gold-glow-border"

                  >

                          : authMode === "login"

                  </button>

                  {(authMode === "login" || authMode === "signup") && (

                        <div className="relative flex justify-center text-[10px] uppercase tracking-widest">

                      </div>

                      <button
                        type="button"

                        className="w-full py-3 rounded-lg border border-white/15 bg-white text-[#030712] font-bold text-sm tracking-wide flex items-center justify-center gap-3 hover:bg-gray-100 transition-all disabled:opacity-60 disabled:cursor-not-allowed"

                        className="absolute top-[-4%] left-1/2 -translate-x-1/2 w-[88%] h-[68%] object-contain filter drop-shadow-[0_12px_15px_rgba(0,0,0,0.8)] pointer-events-none transition-all duration-300"
                        style={{ zIndex: 5 }}
                      />

                      {/* Card Overlay stats on top-left */}
                      <div className="absolute top-[8%] left-[10%] z-20 flex flex-col items-center">
                        <span style={{ color: config.textAccent }} className="font-bebas text-[clamp(20px,3.5vw,32px)] leading-none font-black tracking-tighter">
                          {p.rating}
                        </span>
                        <span className="text-[9px] font-bold text-gray-300 tracking-wider uppercase leading-none mt-1">
                          {p.pos}
                        </span>
                      </div>

                      {/* Card Footer Detail layout */}
                      <div className="absolute bottom-0 left-0 right-0 h-[40%] z-20 flex flex-col items-center justify-end pb-[8%] bg-gradient-to-t from-black/95 via-black/60 to-transparent">
                        <div className="w-[85%] text-center border-b border-white/15 pb-1 mb-2">
                          <h3 style={{ color: config.textAccent }} className="font-bebas text-base tracking-wider whitespace-nowrap overflow-hidden text-ellipsis font-bold uppercase">
                            {p.short}
                          </h3>
                        </div>

                        {/* Attribute grid */}
                        <div className="grid grid-cols-6 gap-x-[1px] w-[90%] text-center px-1">
                          {[
                            { stat: "PAC", val: p.pac },
                            { stat: "SHO", val: p.sho },
                            { stat: "PAS", val: p.pas },
                            { stat: "DRI", val: p.dri },
                            { stat: "DEF", val: p.def },
                            { stat: "PHY", val: p.phy }
                          ].map(s => (
                            <div key={s.stat} className="flex flex-col items-center">
                              <span style={{ color: config.textAccent }} className="font-bebas text-[11px] font-black leading-none">{s.val}</span>
                              <span className="text-[7px] font-bold text-gray-400 tracking-tighter">{s.stat}</span>
                            </div>
                          ))}
                        </div>

                        <div className="flex items-center gap-2 mt-2.5 h-[14%]">
                          <img src={p.flagUrl} alt="" className="h-full object-contain rounded-sm" />
                          <img src={p.clubUrl} alt="" className="h-[120%] object-contain" />
                        </div>
                      </div>

                      {/* Pick confirmation tick */}
                      {isSelected && (
                        <div className="absolute top-[8%] right-[8%] z-30 w-6 h-6 rounded-full bg-white border-2 border-amber-400 flex items-center justify-center shadow-lg">
                          <span className="text-gray-900"><SVGIcons.Check /></span>
                        </div>
                      )}

                    </div>
                  );
                })}
              </div>

              {/* Locked in prediction block */}
              {selectedPlayer && (
                <div className="mt-12 bg-gradient-to-r from-[#030a1a] via-[#051326] to-[#030a1a] p-6 rounded-xl border border-amber-400/25 flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
                  <div className="flex items-center gap-4">
                    <div className="p-3.5 bg-amber-400/10 rounded-lg border border-amber-400/20">
                      <SVGIcons.Prediction />
                    </div>
                    <div>
                      <h4 className="font-bebas text-2xl tracking-wider text-white uppercase">DRAFT PICKS COMMITTED</h4>
                      <p className="text-xs text-gray-400">Backing <span className="text-amber-400 font-bold">{selectedPlayer.name}</span> for the 2026 Golden Boot.</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <img src={selectedPlayer.flagUrl} className="w-8 rounded" alt="" />
                    <span className="text-sm font-bold uppercase tracking-wider">{selectedPlayer.short}</span>
                    <span className="text-xs bg-[#051833] px-3 py-1.5 rounded border border-white/10 font-bold text-amber-400">{selectedPlayer.rating} OVR</span>
                  </div>

                  <button 
                    onClick={startPlayerSimulation}
                    className="btn-gold text-xs px-6 py-3 rounded tracking-wider cursor-pointer font-bold border-none"
                  >
                    Simulate Matches
                  </button>
                </div>
              )}

            </div>
          </section>

          {/* ─── COINS & TOKENS PACKS (Realistic Spheres) ───────── */}
          <section id="tokens" className="py-20 relative z-20 overflow-hidden border-t border-white/5">
            <SectionBlendBg src={BLEND_BACKGROUNDS.stadium} position="left" />
            <div className="max-w-7xl mx-auto px-6 relative z-10">
              
              <div className="text-center max-w-2xl mx-auto mb-12">
                <span className="text-xs font-bold text-amber-400 tracking-widest uppercase">COIN EXCHANGE</span>
                <h2 className="font-bebas text-5xl font-black text-white mt-1 tracking-wide">VALIDATION COINS</h2>
                <div className="tokens-section-rule mx-auto mt-4 mb-4" />
                <p className="text-sm text-gray-400 leading-relaxed">
                  Choose validation coins to verify your prediction entries on kickoff.
                </p>
                {!paymentsReady && (
                  <p className="text-[10px] text-amber-300/80 mt-4 font-bold uppercase tracking-widest">
                    PayFast checkout activating — packs visible for preview
                  </p>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
                {TOKEN_PACKS.map(pk => (
                  <div 
                    key={pk.id}
                    className={`tokens-pack-card bg-gradient-to-b from-[#09152b] to-[#02050c] rounded-xl p-6 flex flex-col h-full transition-all duration-300 hover:scale-[1.02] border relative overflow-hidden ${
                      pk.featured ? 'border-amber-400 shadow-[0_15px_30px_rgba(244,197,66,0.15)]' : 'border-white/10'
                    }`}
                  >
                    {pk.featured && (
                      <div className="absolute top-0 right-0 left-0 bg-amber-400 text-gray-900 text-[9px] font-black tracking-widest uppercase py-1 text-center shadow">
                        MOST POPULAR
                      </div>
                    )}

                    {/* Highly detailed realistic golden coin sphere in the background */}
                    <div className="absolute right-[-10px] top-[25px] opacity-15 pointer-events-none scale-125 animated-coin-bg">
                      <div 
                        style={{ background: `radial-gradient(circle at 35% 30%, #FFF, ${pk.color} 50%, #000 100%)` }}
                        className="w-24 h-24 rounded-full border border-white/20 shadow-2xl"
                      />
                    </div>

                    <div className="flex flex-col mb-6 mt-4 relative z-10">
                      <span className="text-[10px] font-black tracking-widest uppercase mb-1" style={{ color: pk.color }}>
                        {pk.name.toUpperCase()} SYSTEM TIER
                      </span>
                      <h3 className="font-bebas text-3xl uppercase tracking-wide text-white">{pk.name} COIN PACK</h3>
                      
                      <div className="mt-4 flex items-baseline gap-1.5">
                        <span className="text-3xl font-bebas text-amber-400">{pk.value}</span>
                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">VALIDATION COINS</span>
                      </div>
                    </div>

                    <p className="text-xs text-gray-400 mb-6 flex-1 relative z-10 font-medium">
                      {pk.description} Gain validation keys for premium matches.
                    </p>

                    <div className="relative z-10 pt-4 border-t border-white/10">
                      <div className="flex justify-between text-xs font-bold text-gray-400 mb-4">
                        <span>Total Coins:</span>
                        <span className="text-amber-400">{pk.tokens} TOKENS</span>
                      </div>
                      
                      <button 
                        onClick={() => openPaymentModal(pk)}
                        disabled={purchasingPackId === pk.id || !paymentsReady}
                        className={`w-full py-3.5 rounded text-xs uppercase tracking-widest font-black transition-all cursor-pointer border-none disabled:opacity-60 disabled:cursor-not-allowed ${
                          pk.featured ? 'bg-amber-400 text-gray-950 hover:bg-amber-300' : 'bg-[#050c18] text-white border border-white/15 hover:border-white'
                        }`}
                      >
                        {purchasingPackId === pk.id
                          ? "Processing..."
                          : paymentsReady
                            ? `Buy ${pk.value} Pack`
                            : "Coming Soon"}
                      </button>
                    </div>

                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ─── LIVE DRAFT SIMULATOR & BRACKETS ────────────────── */}
          <section id="leaderboard-tracker" className="py-20 border-t border-b border-white/10 relative z-20 overflow-hidden">
            <SectionBlendBg src={BLEND_BACKGROUNDS.stadium} position="bottom" />
            <div className="max-w-7xl mx-auto px-6 relative z-10">
              
              <div className="text-center max-w-2xl mx-auto mb-12">
                <span className="text-xs font-bold text-amber-400 tracking-widest uppercase">
                  {simulationFocus && selectedPlayer ? "YOUR PICK SIMULATION" : "BRACKETS & TRACKER"}
                </span>
                <h2 className="font-bebas text-5xl font-black text-white mt-1">
                  {simulationFocus && selectedPlayer
                    ? `${selectedPlayer.short} GOLDEN BOOT RUN`
                    : "2026 WORLD CUP STANDINGS SIMULATOR"}
                </h2>
                <p className="text-xs text-gray-400 mt-2">
                  {simulationFocus && selectedPlayer
                    ? `Live tournament simulation tracking only ${selectedPlayer.name}'s goal progression round by round.`
                    : "Simulate round outcomes dynamically to watch goals update live across each major tournament tier."}
                </p>
                {simulationFocus && (
                  <button
                    onClick={() => setSimulationFocus(false)}
                    className="mt-4 text-[10px] font-bold uppercase tracking-widest text-amber-400 border border-amber-400/30 px-4 py-2 rounded-full hover:bg-amber-400/10 transition-all cursor-pointer bg-transparent"
                  >
                    View Full Standings
                  </button>
                )}
              </div>

              {simulationFocus && selectedPlayer ? (
                <div className="max-w-3xl mx-auto">
                  <div className="bg-[#02050c] rounded-2xl border border-amber-400/30 overflow-hidden shadow-[0_0_40px_rgba(244,197,66,0.12)]">
                    <div className="relative h-48 sm:h-56 bg-gradient-to-br from-[#0a1b3f] to-[#030712] flex items-end justify-center overflow-hidden">
                      <img
                        src={selectedPlayer.imageUrl}
                        alt={selectedPlayer.name}
                        className="h-[115%] object-contain drop-shadow-[0_12px_30px_rgba(0,0,0,0.8)]"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#02050c] via-transparent to-transparent" />
                      <div className="absolute top-4 left-4 flex items-center gap-2">
                        <img src={selectedPlayer.flagUrl} className="w-8 rounded shadow" alt="" />
                        <span className="text-[10px] font-black uppercase tracking-widest text-amber-400 bg-black/50 px-2 py-1 rounded border border-amber-400/30">YOUR PICK</span>
                      </div>
                    </div>

                    <div className="p-6 sm:p-8">
                      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                        <div>
                          <h3 className="font-bebas text-3xl sm:text-4xl text-white tracking-wider uppercase">{selectedPlayer.short}</h3>
                          <p className="text-xs text-gray-400 mt-1">{selectedPlayer.name} · {selectedPlayer.pos} · {selectedPlayer.nat}</p>
                        </div>
                        <div className="text-center sm:text-right">
                          <span className="font-bebas text-5xl sm:text-6xl font-black text-amber-400 leading-none">
                            {playerScores[selectedPlayer.short] || 0}
                          </span>
                          <p className="text-[10px] font-bold uppercase tracking-widest text-gray-500 mt-1">Total Goals</p>
                        </div>
                      </div>

                      {lastRoundGoals > 0 && (
                        <div className="mb-6 p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/25 text-center">
                          <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                            Last round: +{lastRoundGoals} goals
                          </span>
                        </div>
                      )}

                      <div className="space-y-3 mb-8">
                        {[
                          { index: 0, title: "Group Stage" },
                          { index: 1, title: "Round of 16" },
                          { index: 2, title: "Quarter-Finals" },
                          { index: 3, title: "Semi-Finals" },
                          { index: 4, title: "Final Match" }
                        ].map(stage => {
                          const isActive = currentStage === stage.index;
                          const isCompleted = currentStage > stage.index;
                          return (
                            <div
                              key={stage.index}
                              className={`p-3 rounded-lg border flex items-center justify-between ${
                                isActive
                                  ? "border-amber-400/50 bg-amber-400/5"
                                  : isCompleted
                                    ? "border-emerald-500/25 bg-emerald-950/15"
                                    : "border-white/10 bg-[#050c18]"
                              }`}
                            >
                              <span className="text-xs font-bold uppercase tracking-wider text-white">{stage.title}</span>
                              {isCompleted ? (
                                <span className="text-[10px] text-emerald-400 font-bold">DONE</span>
                              ) : isActive ? (
                                <span className="text-[10px] text-amber-400 font-bold animate-pulse">IN PLAY</span>
                              ) : (
                                <span className="text-[10px] text-gray-600 font-bold">UPCOMING</span>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      <div className="flex gap-3">
                        <button
                          onClick={advanceTournamentStage}
                          disabled={currentStage >= 4}
                          className="flex-1 btn-gold py-3.5 px-4 rounded text-xs tracking-wider cursor-pointer disabled:opacity-50 border-none font-black"
                        >
                          {currentStage >= 4 ? "Simulation Complete" : `Simulate ${selectedPlayer.short}'s Next Round`}
                        </button>
                        <button
                          onClick={resetTournamentSimulation}
                          className="py-3.5 px-4 rounded text-xs font-bold border border-white/15 hover:border-white bg-transparent text-white cursor-pointer"
                        >
                          Reset
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                {/* Simulation Brackets (Left) */}
                <div className="lg:col-span-5 space-y-4">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Tournament Progression Stages</h3>
                  
                  {[
                    { index: 0, title: "Group Stage", matches: "48 Open Matches" },
                    { index: 1, title: "Round of 16", matches: "8 Elimination Matches" },
                    { index: 2, title: "Quarter-Finals", matches: "Last 8 Standings Contenders" },
                    { index: 3, title: "Semi-Finals", matches: "Final Four Arena" },
                    { index: 4, title: "Final Match", matches: "World Cup 2026 Champion" }
                  ].map(stage => {
                    const isActive = currentStage === stage.index;
                    const isCompleted = currentStage > stage.index;
                    return (
                      <div 
                        key={stage.index}
                        className={`p-4 rounded-lg border transition-all ${
                          isActive 
                            ? 'bg-[#030a1a] border-amber-400/50 shadow-[0_0_15px_rgba(244,197,66,0.15)]' 
                            : isCompleted 
                              ? 'bg-emerald-950/20 border-emerald-500/30 text-gray-400' 
                              : 'bg-[#02050c] border-white/10 text-gray-500'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <div>
                            <span className="text-[10px] font-bold tracking-widest uppercase block text-amber-400">STAGE {stage.index + 1}</span>
                            <h4 className="font-bebas text-xl text-white tracking-wider uppercase mt-0.5">{stage.title}</h4>
                          </div>
                          {isCompleted ? (
                            <span className="text-xs text-emerald-400 font-bold tracking-wider">COMPLETED</span>
                          ) : isActive ? (
                            <span className="text-xs text-amber-400 font-bold tracking-wider animate-pulse">LIVE GAMEPLAY</span>
                          ) : (
                            <span className="text-xs text-gray-600 font-bold tracking-wider">LOCKED</span>
                          )}
                        </div>
                        <p className="text-[11px] text-gray-400 mt-1 font-medium">{stage.matches}</p>
                      </div>
                    );
                  })}

                  {/* Simulations controls */}
                  <div className="pt-4 flex gap-4">
                    <button 
                      onClick={advanceTournamentStage}
                      disabled={currentStage >= 4}
                      className="flex-1 btn-gold py-3 px-4 rounded text-xs tracking-wider cursor-pointer disabled:opacity-50 border-none"
                    >
                      {currentStage >= 4 ? "Tournament Completed" : "Simulate Next Round"}
                    </button>
                    <button 
                      onClick={resetTournamentSimulation}
                      className="py-3 px-4 rounded text-xs font-bold border border-white/15 hover:border-white bg-transparent transition-all text-white cursor-pointer"
                    >
                      Reset
                    </button>
                  </div>
                </div>

                {/* Scoreboard (Right) */}
                <div className="lg:col-span-7 bg-[#02050c] p-6 rounded-xl border border-white/10">
                  <div className="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
                    <h3 className="font-bebas text-2xl tracking-wider text-white">GOAL STANDINGS</h3>
                    <span className="text-xs bg-[#051833] px-3 py-1 rounded border border-white/10 font-bold text-amber-400">LIVE DRAFT TRACKER</span>
                  </div>

                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-2">
                    {sortedScoreboard.map((item, idx) => {
                      const isUserBacking = selectedPlayer?.short === item.name;
                      return (
                        <div 
                          key={item.name}
                          className={`p-3 rounded-lg flex items-center justify-between transition-all ${
                            isUserBacking 
                              ? 'bg-amber-400/10 border border-amber-400/35 shadow-[0_4px_12px_rgba(244,197,66,0.1)]' 
                              : 'bg-[#050c18] border border-white/5'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-sm font-bold text-gray-400 w-5">{idx + 1}</span>
                            <img src={item.flag} className="w-6 rounded shadow-sm" alt="" />
                            <div>
                              <span className="text-xs font-bold text-white uppercase tracking-wider block">
                                {item.name} {isUserBacking && <span className="text-[10px] text-amber-400 font-black ml-1.5">(BACKED BY YOU)</span>}
                              </span>
                              <span className="text-[9px] text-gray-500 font-medium">Competitor: {item.rating} OVR rating</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-4">
                            <span className="font-bebas text-2xl font-black text-amber-400">{item.goals} GOALS</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
              )}

            </div>
          </section>

          {/* ─── SPONSORS MATRIX (Match references) ─────────────── */}
          <section id="sponsors" className="py-16 relative z-20 border-t border-b border-white/10 select-none overflow-hidden">
            <SectionBlendBg src={BLEND_BACKGROUNDS.crowd} position="center" soft />
            <div className="max-w-7xl mx-auto px-6 relative z-10">
              
              <div className="text-center mb-8">
                <span className="text-[10px] font-black text-gray-500 uppercase tracking-widest block">OFFICIAL SUPPORT BRANDS</span>
                <h3 className="font-bebas text-2xl tracking-wider text-amber-400 uppercase mt-1">FIFA PARTNER NETWORK</h3>
              </div>

              <div className="grid grid-cols-3 sm:grid-cols-5 gap-4 max-w-5xl mx-auto">
                {SPONSORS.map((sponsor) => (
                  <div key={sponsor.id} className="sponsor-card" title={sponsor.name}>
                    <img
                      src={sponsor.logo}
                      alt={sponsor.name}
                      className="sponsor-logo"
                      loading="lazy"
                    />
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ─── FOOTER FEATURE BAR ────────────────────────────── */}
          <footer className="relative bg-[#02050c] text-white/50 border-t border-white/10 mt-auto overflow-hidden">
            <SectionBlendBg src={BLEND_BACKGROUNDS.match} position="right" soft />
            <div className="max-w-7xl mx-auto px-6 py-10 grid grid-cols-2 md:grid-cols-4 gap-6 border-b border-white/10 text-xs text-center md:text-left relative z-10">
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">PREDICT & WIN</span>
                <p className="text-[10px] text-gray-500 mt-0.5">Secure verification slots for premium matches.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">EXCLUSIVE REWARDS</span>
                <p className="text-[10px] text-gray-500 mt-0.5">Cars, luxury hotel stays, and verified cash sweepstakes.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">SECURE & FAIR</span>
                <p className="text-[10px] text-gray-500 mt-0.5">100% verified prediction engines under official compliance rules.</p>
              </div>
              <div>
                <span className="block font-bold text-white tracking-wider uppercase">24/7 SUPPORT</span>
                <p className="text-[10px] text-gray-500 mt-0.5">
                  Issues or questions? Email{" "}
                  <a href="mailto:support@playmzansi.online" className="text-amber-400 hover:text-amber-300">support@playmzansi.online</a>
                </p>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between text-[10px] font-bold text-gray-500 uppercase tracking-widest gap-4 relative z-10">
              <span>© 2026 FIFA WORLD CUP GOALKING . ALL RIGHTS RESERVED.</span>
              <div className="flex flex-wrap gap-6 justify-center md:justify-end">
                <a href="mailto:support@playmzansi.online" className="hover:text-amber-400">SUPPORT</a>
                <a href={LEGAL_LINKS.terms} target="_blank" rel="noopener noreferrer" className="hover:text-white">TERMS & CONDITIONS</a>
                <a href={LEGAL_LINKS.privacy} target="_blank" rel="noopener noreferrer" className="hover:text-white">PRIVACY POLICY</a>
                <a href={LEGAL_LINKS.refund} target="_blank" rel="noopener noreferrer" className="hover:text-white">REFUND POLICY</a>
              </div>
            </div>

          </footer>

        </div>
        </>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
